/* Top offset — the island is a left sidebar (not stacked above content like the old
   topnav-strip was), so on desktop the offset only needs to clear the topbar itself. */
function updateMainTopOffset(){
  const shell=document.querySelector('.topbar-shell')
  const isDesktop = window.innerWidth > 768
  const off = isDesktop
    ? (shell ? shell.getBoundingClientRect().bottom+22 : 100)
    : 90
  document.documentElement.style.setProperty('--main-top-offset', off+'px')
}
window.addEventListener('resize', updateMainTopOffset)


/* Refresh with overlay shimmer (keeps existing content visible) */
async function refreshWithOverlay(containerId, loadFn, sectionLabel){
  const host = document.getElementById(containerId)
  if (!host){ return loadFn() }
  const hasContent = host.children.length > 0 && !host.querySelector('.sk')
  if (hasContent) host.classList.add('refresh-host','refreshing')
  try {
    await loadFn()
    showToast('info', `${sectionLabel || 'Data'} refreshed.`)
  } finally { host.classList.remove('refreshing') }
}

/* =============== DOCTORS =============== */
// A doctor whose profile was scrubbed (permanently removed while keeping history intact)
// is identified by our placeholder email pattern, since email is NOT NULL in the schema.
function isDeletedDoctor(doc){ return typeof doc.email === 'string' && doc.email.startsWith('deleted+') && doc.email.endsWith('@atbu.invalid') }

let paymentStatusFilter = 'pending_verification' // '' (all) | 'unpaid' | 'pending_verification' | 'paid'
let apptStatusFilter = '' // '' (all) | 'pending' | 'approved' | 'completed' | 'missed' | 'cancelled'
let doctorsFilter = 'all' // 'all' | 'active' | 'deactivated'

async function loadDoctors(){
  const el = document.getElementById('doctorsList'); if (!el.classList.contains('refreshing')) el.innerHTML = skCards(4)
  const { data, error } = await supabase.from('doctors')
    .select('id, full_name, licence_number, email, phone, is_active')
    .order('full_name',{ascending:true})
  if (error){ el.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Error loading doctors.</div>`; return }
  // Deleted (scrubbed) doctors never show, in any filter.
  let visible = (data||[]).filter(d => !isDeletedDoctor(d))
  if (doctorsFilter === 'active') visible = visible.filter(d => d.is_active)
  else if (doctorsFilter === 'deactivated') visible = visible.filter(d => !d.is_active)
  renderAccordion(el, visible.map(r => ({
    avatar: escHtml(initials(r.full_name)),
    name: escHtml(r.full_name || 'Unknown'),
    badge: badge(r.is_active ? 'active' : 'deactivated'),
    sub: `<span><i class="ph ph-identification-card"></i> ${r.licence_number ? escHtml(r.licence_number) : '—'}</span>`,
    body: acField('Licence', r.licence_number ? escHtml(r.licence_number) : emptyIcon())
        + acField('Email', r.email ? escHtml(r.email) : emptyIcon())
        + acField('Phone', r.phone ? escHtml(r.phone) : emptyIcon())

/* =============== HARD DELETE STAFF (requires typing exact email) =============== */
function openHardDeleteStaff(role, staffId, staffEmail){
  const table = role === 'doctor' ? 'doctors' : 'pharmacists'
  const label = role === 'doctor' ? 'Doctor' : 'Pharmacist'
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `<div class="modal-card no-sheet">
    <div class="modal-title">Permanently Delete ${label}</div>
    <div class="modal-msg">${role==='doctor' ? 'This will permanently erase this doctor\'s profile <strong>and</strong> every appointment, prescription, and payment record tied to them — past, completed, cancelled, or otherwise.' : 'This will permanently erase this pharmacist\'s account.'} This action <strong>cannot be undone</strong>.</div>
    <div class="form-field" style="margin-top:10px"><label class="form-label">Type the ${role}'s email to confirm</label>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${escHtml(staffEmail)}</div>
      <input class="form-input" id="hardDeleteEmailInput" placeholder="Type email exactly to confirm" autocomplete="off">
      <div class="field-error" id="hardDeleteEmailMismatch" style="display:none;margin-top:6px"><i class="ph ph-warning-circle"></i> Email doesn't match — please type it exactly.</div>
    </div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn-secondary" data-act="cancel">Cancel</button>
      <button class="btn-danger btn" data-act="ok" style="padding:10px 20px;font-size:13px" disabled><i class="btn-icon ph-bold ph-trash"></i><span class="btn-text">Delete Permanently</span><span class="btn-dots"><span></span><span></span><span></span></span></button>
    </div>
  </div>`
  document.body.appendChild(bd)
  const close = () => bd.remove()
  bd.addEventListener('click', e => { if (e.target === bd) close() })
  bd.querySelector('[data-act="cancel"]').addEventListener('click', close)
  const input = bd.querySelector('#hardDeleteEmailInput')
  const mismatchMsg = bd.querySelector('#hardDeleteEmailMismatch')
  const okBtn = bd.querySelector('[data-act="ok"]')
  input.addEventListener('input', () => {
    const matches = input.value === staffEmail
    okBtn.disabled = !matches
    mismatchMsg.style.display = (input.value.length > 0 && !matches) ? 'flex' : 'none'
  })
  okBtn.addEventListener('click', async () => {
    if (input.value !== staffEmail) return
    setBtnLoading(okBtn, true)

    // Deleting straight from the doctors/pharmacists table only ever removed the
    // profile row — the real login lives in auth.users, so that account (and its
    // email) would stick around and block re-creation. We now call the delete-user
    // edge function, which uses the service-role key to delete the auth.users row;
    // the on-delete-cascade FKs then take the doctors/pharmacists row (and every
    // downstream record) with it automatically.
    try {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session || !session.access_token){
        showToast('error', 'No valid session. Please log out and back in.')
        setBtnLoading(okBtn, false)
        return
      }
      const resp = await fetch(DELETE_USER_FUNCTION_URL, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
        body: JSON.stringify({ user_id: staffId })
      })
      const body = await resp.json()
      if (!resp.ok || body.error){
        handleErr(new Error(body.error || `Could not delete ${role}.`), `Error deleting ${role}.`)
        setBtnLoading(okBtn, false)
        return
      }
    } catch (err){
      handleErr(err, `Error deleting ${role}.`)
      setBtnLoading(okBtn, false)
      return
    }
    close()
    showToast('success', `${label} permanently deleted.`)
    if (role === 'doctor'){ loadDoctors(); loadRosterDoctorSelect() } else { loadPharmacists() }
    loadOverview()
  })
}

function openStaffModal(role){
  const label = role === 'doctor' ? 'Doctor' : 'Pharmacist'
  const licPh = role === 'doctor' ? 'LIC-001' : 'PH-001'
  const licPrefix = role === 'doctor' ? 'LIC' : 'PH'
  const roleIcon = role === 'doctor' ? 'ph-stethoscope' : 'ph-pill'
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `<div class="modal-card wide sheet">
    <div class="sheet-handle"></div>
    <div class="modal-branded-head"><div class="brand-icon" style="background:var(--brand-grad)"><i class="ph ${roleIcon}"></i></div><div><h3>Add ${label}</h3><p>Create a login account for the new ${role}.</p></div></div>
    <form id="staffForm" novalidate>
      <div class="form-grid">
        <div class="form-field"><label class="form-label">Full Name</label><input class="form-input" name="full_name" placeholder="e.g. ${role==='doctor'?'Dr. Jane Doe':'Musa Bello'}" required><div class="field-error" data-err="full_name"><i class="ph ph-warning-circle"></i> Please enter the full name.</div></div>
        <div class="form-field"><label class="form-label">Licence Number</label><input class="form-input" name="licence_number" placeholder="${licPh}" required><div class="field-error" data-err="licence_number"><i class="ph ph-warning-circle"></i> Format must be like ${licPh} and must not already be in use.</div></div>
        <div class="form-field"><label class="form-label">Email</label><input class="form-input" type="email" name="email" placeholder="name@atbu.edu.ng" required><div class="field-error" data-err="email"><i class="ph ph-warning-circle"></i> Email must be a valid, unused @atbu.edu.ng address.</div></div>
        <div class="form-field"><label class="form-label">Phone</label><input class="form-input" type="tel" name="phone" placeholder="+234…" required><div class="field-error" data-err="phone"><i class="ph ph-warning-circle"></i> Please enter a phone number.</div></div>
      </div>
      <div id="staffFormMsg" style="margin-top:14px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px"></div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" data-act="cancel">Cancel</button>
        <button type="submit" class="btn-primary btn"><i class="btn-icon ph-bold ph-check"></i><span class="btn-text">Create ${label}</span><span class="btn-dots"><span></span><span></span><span></span></span></button>
      </div>
    </form>
  </div>`
  document.body.appendChild(bd)
  document.body.style.overflow = 'hidden'
  const close = () => { bd.remove(); document.body.style.overflow = '' }
  bd.addEventListener('click', e => { if (e.target === bd) close() })
  bd.querySelector('[data-act="cancel"]').addEventListener('click', close)
  bd.querySelector('#staffForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const submitBtn = bd.querySelector('button[type="submit"]')
    const submitBtnOrigHtml = submitBtn ? submitBtn.innerHTML : ''
    const fd = new FormData(e.target)
    const full_name = String(fd.get('full_name')||'').trim()
    const licence_number = String(fd.get('licence_number')||'').trim()
    const email = String(fd.get('email')||'').trim()
    const phone = String(fd.get('phone')||'').trim()
    const msg = bd.querySelector('#staffFormMsg')
    bd.querySelectorAll('.field-error').forEach(x => x.classList.remove('show'))
      bd.querySelectorAll('.form-input').forEach(x => x.classList.remove('is-invalid'))
      const missing = []
      if (!full_name) missing.push('full_name')
      const licPattern = new RegExp('^' + licPrefix + '-\\d{3,}$')
      if (!licence_number || !licPattern.test(licence_number)) missing.push('licence_number')
      if (!email || !/^[^@\s]+@atbu\.edu\.ng$/i.test(email)) missing.push('email')
      if (!phone) missing.push('phone')
      if (missing.length){
        missing.forEach(n => {
          bd.querySelector(`[data-err="${n}"]`)?.classList.add('show')
          bd.querySelector(`[name="${n}"]`)?.classList.add('is-invalid')
        })
        msg.innerHTML = '<i class="ph ph-warning-circle" style="color:var(--error)"></i> <span style="color:var(--error)">Please correct the highlighted fields.</span>'
        return
      }
    msg.style.color='var(--text-muted)'; msg.textContent = 'Checking licence number and email are unique…'
    setBtnLoading(submitBtn, true)
    // Licence numbers and emails must be unique across BOTH doctors and pharmacists, since staff can only hold one role.
    try {
      const [{ data: licDocs }, { data: licPharms }, { data: emailDocs }, { data: emailPharms }] = await Promise.all([
        supabase.from('doctors').select('id').eq('licence_number', licence_number),
        supabase.from('pharmacists').select('id').eq('licence_number', licence_number),
        supabase.from('doctors').select('id').eq('email', email),
        supabase.from('pharmacists').select('id').eq('email', email),
      ])
      if ((licDocs && licDocs.length) || (licPharms && licPharms.length)){
        bd.querySelector('[data-err="licence_number"]')?.classList.add('show')
        bd.querySelector('[name="licence_number"]')?.classList.add('is-invalid')
        msg.innerHTML = '<i class="ph ph-warning-circle" style="color:var(--error)"></i> <span style="color:var(--error)">This licence number is already assigned to another staff member.</span>'
        setBtnLoading(submitBtn, false)
        return
      }
      if ((emailDocs && emailDocs.length) || (emailPharms && emailPharms.length)){
        bd.querySelector('[data-err="email"]')?.classList.add('show')
        bd.querySelector('[name="email"]')?.classList.add('is-invalid')
        msg.innerHTML = '<i class="ph ph-warning-circle" style="color:var(--error)"></i> <span style="color:var(--error)">This email is already in use by another staff member.</span>'
        setBtnLoading(submitBtn, false)
        return
      }
    } catch (uniqErr){
      msg.style.color='var(--error)'; msg.textContent = 'Could not verify uniqueness: '+(uniqErr.message||'network error')
      setBtnLoading(submitBtn, false)
      return
    }
    msg.style.color='var(--text-muted)'; msg.textContent = `Creating ${role} account…`
    try {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session || !session.access_token){ msg.style.color='var(--error)'; msg.textContent='No valid session. Please log out and back in.'; setBtnLoading(submitBtn, false); return }
      const resp = await fetch(CREATE_STAFF_FUNCTION_URL, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
        body: JSON.stringify({ role, full_name, licence_number, email, phone })
      })
      const body = await resp.json()
      if (!resp.ok){ msg.style.color='var(--error)'; msg.textContent = 'Error: '+(body.error||`Could not create ${role}.`); setBtnLoading(submitBtn, false); return }
      close()
      const pwLine = body.temp_password ? escHtml(body.temp_password) : 'use email when logging in for the first time'
      openStaffSuccessModal({ role, label, full_name, email, phone, pwLine })
      showToast('success', `${label} account created`)
      if (role === 'doctor'){ loadDoctors(); loadRosterDoctorSelect() } else { loadPharmacists() }
      loadOverview()
    } catch (err){
      msg.style.color='var(--error)'; msg.textContent = 'Error: '+(err.message||'Network error')
      setBtnLoading(submitBtn, false)
    }
  })
}

async function loadRoster(){
  const el = document.getElementById('rosterList'); if (!el.classList.contains('refreshing')) el.innerHTML = skCards(5)
  const todayStr = new Date().toISOString().split('T')[0]
  const { data, error } = await supabase.from('doctor_slots')
    .select('id, date, shift, capacity, booked_count, doctors ( full_name )')
    .gte('date', todayStr).order('date',{ascending:true})
  if (error){ el.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Error loading roster.<br><small>${escHtml(error.message)}</small></div>`; return }
  renderAccordion(el, (data||[]).map(r => {
    const cap = Number(r.capacity) || 0
    const booked = Number(r.booked_count) || 0
    const pctRaw = cap > 0 ? (booked / cap) * 100 : 0
    const pct = Math.max(0, Math.min(100, pctRaw))
    const cls = pct <= 50 ? 'low' : (pct < 90 ? 'mid' : 'high')
    const bookedHtml = `${escHtml(String(booked))} / ${escHtml(String(cap))}`
      + `<div class="roster-bar"><div class="roster-bar-fill ${cls}" style="width:${pct}%"></div></div>`
    return {
      icon: 'ph-calendar-blank',
      name: `<span class="cell-date">${escHtml(formatDate(r.date))}</span>`,
      badge: shiftBadge(r.shift),
      sub: `<span>${docName(r.doctors ? r.doctors.full_name : 'Unknown')}</span>`,
      body: acField('Booked', bookedHtml)
    }
  }), 'No upcoming shifts scheduled.')
}
async function resetRoster(){
  const ok = await showConfirm('Reset Roster', 'This will cancel every upcoming shift that has zero appointments booked. This action cannot be undone.', 'Reset Roster', 'no-sheet')
  if (!ok) return
  const todayStr = new Date().toISOString().split('T')[0]

async function loadAllPayments(){
  const el = document.getElementById('allPaymentsList'); if (!el.classList.contains('refreshing')) el.innerHTML = skCards(4)

    .select('id, payment_code, amount, status, payment_method, payment_reference, prescription_id, prescriptions ( status ), patients ( full_name )')

  if (statusFilter) query = query.eq('status', statusFilter)
  const { data, error } = await query
  if (error){ el.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Error loading payments.</div>`; return }
  renderAccordion(el, (data||[]).map(r => {
    let action
    if (r.status === 'pending_verification') action = `<button class="btn-primary btn-sm" data-verify="${r.id}" data-status="paid"><i class="ph-bold ph-check"></i> Mark Paid</button><button class="btn-danger btn-sm" data-verify="${r.id}" data-status="unpaid">Reject</button>`
    else if (r.status !== 'paid') action = emptyIcon()
    else if (r.prescriptions && r.prescriptions.status === 'dispensed') action = `<span class="badge locked"><i class="ph-fill ph-lock-simple"></i> Dispensed</span>`
    else action = `<button class="btn-danger btn-sm" data-cancel="${r.id}">Cancel Receipt</button>`
    return {
      icon: 'ph-receipt',
      code: escHtml(r.payment_code || r.id),
      name: escHtml(r.patients ? r.patients.full_name : 'Unknown'),
      badge: badge(r.status),
      sub: `<span><i class="ph ph-currency-ngn"></i> ${formatCurrency(r.amount)}</span>`,
      body: acField('Method', r.payment_method ? escHtml(r.payment_method) : emptyIcon())
          + acField('Reference', r.payment_reference ? escHtml(r.payment_reference) : emptyIcon())
          + `<div class="ac-actions ac-span-2">${action}</div>`
    }
  }), 'No payments found.')
  el.querySelectorAll('button[data-cancel]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); openCancelReceipt(b.dataset.cancel) }))
  el.querySelectorAll('button[data-verify]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); verifyPayment(b.dataset.verify, b.dataset.status) }))
}
async function openCancelReceipt(paymentId){
  const reasons = ['Payment not received','Duplicate payment','Wrong amount','Suspected fraud','Other']
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `<div class="modal-card sheet">
    <div class="sheet-handle"></div>
    <div class="modal-title">Cancel Receipt</div>
    <div class="modal-msg">Select a reason for cancellation. This action cannot be undone.</div>
    <div class="form-field"><label class="form-label">Reason</label><div class="custom-select-wrap" id="cancelReasonCS"></div></div>
    <div class="form-field" id="cancelOtherWrap" style="margin-top:12px;display:none"><label class="form-label">Please specify</label><input class="form-input" id="cancelOtherInput" placeholder="Enter reason"></div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn-secondary" data-act="cancel">Back</button>
      <button class="btn-danger" data-act="ok" style="padding:10px 20px;font-size:13px">Cancel Receipt</button>
    </div>
  </div>`
  document.body.appendChild(bd)
  initCS('cancelReasonCS', reasons.map(r => ({value:r,label:r})), { placeholder:'Choose a reason', onChange: v => {
    bd.querySelector('#cancelOtherWrap').style.display = v==='Other' ? 'flex' : 'none'
  }})
  const close = () => bd.remove()
  bd.addEventListener('click', e => { if (e.target === bd) close() })
  bd.querySelector('[data-act="cancel"]').addEventListener('click', close)
  bd.querySelector('[data-act="ok"]').addEventListener('click', async () => {
    let reasonText = getCS('cancelReasonCS')
    if (!reasonText){ showToast('error','Please select a reason.'); return }
    if (reasonText === 'Other'){
      const custom = bd.querySelector('#cancelOtherInput').value.trim()
      if (!custom){ showToast('error','Please enter a reason.'); return }
      reasonText = custom
    }
    const { error } = await supabase.rpc('cancel_receipt', { p_payment_id:paymentId, p_admin_id:currentAdminId, p_reason:reasonText })
    if (error){
      if (error.message.includes('ALREADY_DISPENSED')) showToast('error','Cannot cancel — this prescription has already been dispensed.')
      else showToast('error','Error cancelling receipt: '+error.message)
      return
    }
    close()
    showToast('success','Receipt cancelled successfully.')
    loadAllPayments(); loadOverview()
  })
}

  if (clearBtn) clearBtn.classList.toggle('show', !!term)

/* Bottom-sheet patient profile: header + read-only medical record + appointment
   history accordion with each appointment's prescription nested in its own body. */
async function openPatientProfileModal(patientId){
  const p = currentPatientList.find(x => x.id === patientId)
  if (!p) return
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `<div class="modal-card wide sheet">
    <div class="sheet-head-sticky"><div class="sheet-handle"></div></div>
    <div id="ppBody"><div class="pp-empty"><i class="ph ph-spinner spin"></i> Loading patient…</div></div>
    <div class="modal-actions" style="margin-top:20px"><button class="btn-primary" data-act="close">Close</button></div>
  </div>`
  document.body.appendChild(bd)
  document.body.style.overflow = 'hidden'
  const close = () => { bd.remove(); document.body.style.overflow = '' }
  bd.addEventListener('click', e => { if (e.target === bd) close() })
  bd.querySelector('[data-act="close"]').addEventListener('click', close)
  const body = bd.querySelector('#ppBody')

  const [mrRes, apRes, rxRes] = await Promise.all([
    supabase.from('patient_medical_records').select('genotype, blood_group, allergies, chronic_conditions, emergency_contact_name, emergency_contact_number').eq('patient_id', patientId).maybeSingle(),
    supabase.from('appointments').select('id, appointment_code, assigned_time, reason, status, advice_to_patient, cancellation_note, created_at, patients ( full_name ), doctor_slots ( date, shift, doctors ( full_name ) )').eq('patient_id', patientId).order('created_at',{ascending:false}),
    supabase.from('prescriptions').select('id, status, created_at, appointment_id, prescription_items ( dosage, frequency, duration, quantity, drug_stock ( drug_name, unit ) )').eq('patient_id', patientId).order('created_at',{ascending:false})
  ])

  let mrHtml
  if (mrRes.error){
    const code = mrRes.error.code || ''
    if (code === '42501' || /permission|policy/i.test(mrRes.error.message||'')){
      mrHtml = `<div class="pp-empty"><i class="ph ph-lock"></i> You don't have permission to view this patient's medical record.</div>`
    } else {
      mrHtml = `<div class="pp-empty"><i class="ph ph-warning-circle"></i> Could not load medical record.</div>`
    }
  } else if (!mrRes.data){
    mrHtml = `<div class="pp-empty"><i class="ph ph-info"></i> This patient has not filled in their medical record yet.</div>`
  } else {
    const mr = mrRes.data
    const row = (k,v) => `<div class="pp-mr-row"><strong>${k}</strong><span>${escHtml(v || '—')}</span></div>`
    mrHtml = `<div class="pp-mr-card">
      ${row('Genotype', mr.genotype)}
      ${row('Blood Group', mr.blood_group)}
      ${row('Allergies', mr.allergies)}
      ${row('Chronic Conditions', mr.chronic_conditions)}
      ${row('Emergency Contact Name', mr.emergency_contact_name)}
      ${row('Emergency Contact Number', mr.emergency_contact_number)}
    </div>`
  }

  // Admin-only profile facts (email, DOB, age, address) stay, in the same fact-card style.
  const age = computeAge(p.dob)
  const profileHtml = `<div class="pp-mr-card">
    <div class="pp-mr-row"><strong>Email</strong><span>${p.email ? escHtml(p.email) : '—'}</span></div>
    <div class="pp-mr-row"><strong>Phone</strong><span>${p.phone ? escHtml(p.phone) : '—'}</span></div>
    <div class="pp-mr-row"><strong>Date of Birth</strong><span>${p.dob ? escHtml(p.dob) : '—'}</span></div>
    <div class="pp-mr-row"><strong>Age</strong><span>${age != null ? escHtml(String(age)) + ' yrs' : '—'}</span></div>
    <div class="pp-mr-row"><strong>Gender</strong><span>${p.gender ? escHtml(p.gender) : '—'}</span></div>
    <div class="pp-mr-row"><strong>Address</strong><span>${p.address ? escHtml(p.address) : '—'}</span></div>
  </div>`

  const appts = apRes.data || []
  const rxMap = {}
  if (rxRes && !rxRes.error){ (rxRes.data||[]).forEach(rx => { if (rx.appointment_id) rxMap[rx.appointment_id] = rx }) }

  let apHtml
  if (apRes.error) apHtml = `<div class="pp-empty"><i class="ph ph-warning-circle"></i> Could not load appointment history.</div>`
  else if (!appts.length) apHtml = `<div class="pp-empty"><i class="ph ph-tray"></i> No appointment history for this patient.</div>`
  else apHtml = `<div id="ppApptAcc"></div>`

  body.innerHTML = `
    <div class="pp-head">
      <div class="pp-avatar">${escHtml(initials(p.full_name))}</div>
      <div class="pp-head-meta">
        <div class="pp-head-name">${escHtml(p.full_name || 'Unknown')}</div>
        <div class="pp-head-sub">
          ${p.gender ? `<span><i class="ph ph-user"></i> ${escHtml(p.gender)}</span>` : ''}
          ${p.phone ? `<span><i class="ph ph-phone"></i> ${escHtml(p.phone)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="pp-section">
      <div class="pp-section-title"><i class="ph ph-identification-card" style="color:var(--primary)"></i> Profile</div>
      ${profileHtml}
    </div>
    <div class="pp-section">
      <div class="pp-section-title"><i class="ph-fill ph-heartbeat" style="color:var(--primary)"></i> Medical Record <span class="pp-ro">(read-only)</span></div>
      ${mrHtml}
    </div>
    <div class="pp-section">
      <div class="pp-section-title"><i class="ph ph-clock-counter-clockwise" style="color:var(--primary)"></i> Appointment History &amp; Prescriptions</div>
      ${apHtml}
    </div>`

  const acc = body.querySelector('#ppApptAcc')
  if (acc){
    renderAccordion(acc, appts.map(a => {
      const card = apptAccordionCard(a)

      card.body += `<div class="ac-span-2"><div class="ac-k">Prescription</div>${rxItemsHtml(rxMap[a.id])}</div>`

function rxItemsHtml(rx){
  if (!rx) return `<div class="ac-rx-empty"><i class="ph ph-prescription"></i> No prescription for this appointment.</div>`
  const items = rx.prescription_items || []
  if (!items.length) return `<div class="ac-rx-empty"><i class="ph ph-prescription"></i> Prescription has no items.</div>`
  return `<div class="rx-hist-items" style="border-top:none;padding-top:0">` + items.map(it => `
    <div class="rx-hist-item">
      <div class="rx-hist-drug">${escHtml(it.drug_stock ? it.drug_stock.drug_name : 'Drug')}</div>
      <div class="rx-hist-qty">${escHtml(String(it.quantity ?? ''))} ${escHtml(it.drug_stock ? (it.drug_stock.unit||'') : '')}</div>
      <div class="rx-hist-detail">${escHtml([it.dosage, it.frequency, it.duration].filter(Boolean).join(' • ') || '—')}</div>
    </div>`).join('') + `</div>`
}

async function shareStaffCard({ role, label, full_name, email, phone, pwLine }){
  const W = 900, H = 560
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')
  // Background gradient
  const grad = ctx.createLinearGradient(0,0,W,H)
  grad.addColorStop(0,'#2C97D6'); grad.addColorStop(1,'#1E7FB8')
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H)
  // Card
  ctx.fillStyle = '#FFFFFF'
  const cx=40, cy=40, cw=W-80, ch=H-80, r=24
  ctx.beginPath()
  ctx.moveTo(cx+r,cy); ctx.arcTo(cx+cw,cy,cx+cw,cy+ch,r); ctx.arcTo(cx+cw,cy+ch,cx,cy+ch,r); ctx.arcTo(cx,cy+ch,cx,cy,r); ctx.arcTo(cx,cy,cx+cw,cy,r)
  ctx.closePath(); ctx.fill()
  // Title bar
  ctx.fillStyle = '#1E7FB8'
  ctx.font = '700 26px Poppins, sans-serif'
  ctx.fillText('ATBU MediCare', cx+32, cy+50)
  ctx.fillStyle = '#64748B'
  ctx.font = '600 14px Poppins, sans-serif'
  ctx.fillText(`${label} account was created with details:`, cx+32, cy+82)
  // Divider
  ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(cx+32, cy+100); ctx.lineTo(cx+cw-32, cy+100); ctx.stroke()
  // Fields
  const fields = [['Name', full_name],['Phone', phone],['Email', email],['Password', pwLine]]
  let y = cy + 140
  fields.forEach(([k,v]) => {
    ctx.fillStyle = '#64748B'; ctx.font = '600 15px Poppins, sans-serif'
    ctx.fillText(k + ':', cx+32, y)
    ctx.fillStyle = '#0F172A'; ctx.font = '600 17px Poppins, sans-serif'
    ctx.fillText(String(v), cx+150, y)
    y += 42
  })
  ctx.fillStyle = '#94A3B8'; ctx.font = '500 12px Poppins, sans-serif'
  ctx.fillText('Generated by ATBU MediCare Admin', cx+32, cy+ch-24)
  const filename = `${label}-${full_name.replace(/\s+/g,'_')}-account.png`
  canvas.toBlob(async (blob) => {
    if (!blob){ showToast('error','Could not generate image.'); return }
    try {
      if (navigator.canShare && navigator.canShare({ files:[new File([blob], filename, {type:'image/png'})] })){
        await navigator.share({ files:[new File([blob], filename, {type:'image/png'})], title:`${label} account`, text:`${label} account for ${full_name}` })
        return
      }
    } catch(e){ /* fall through to download */ }
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 1000)
    showToast('success','Image downloaded.')
  }, 'image/png')
}

/* =============== HOVER + ARROW-KEY SCROLL =============== */
/* When the mouse is over the side nav or the main content area, Up/Down arrow keys scroll that panel. */
;(function setupHoverArrowScroll(){
  const SCROLL_STEP = 80
  let hoveredPanel = null // 'nav' | 'main' | null
  const navScrollEl = () => document.getElementById('islandNavList')
  const mainEl = () => document.querySelector('main.main')

  const navHoverTarget = document.getElementById('islandNav')
  const mainHoverTarget = document.querySelector('main.main')

  if (navHoverTarget){
    navHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'nav' })
    navHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'nav') hoveredPanel = null })
  }
  if (mainHoverTarget){
    mainHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'main' })
    mainHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'main') hoveredPanel = null })
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return
    if (!hoveredPanel) return
    // Don't hijack arrow keys while typing in an input/textarea or using a custom select.
    const tag = (document.activeElement && document.activeElement.tagName) || ''
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return

    const delta = e.key === 'ArrowDown' ? SCROLL_STEP : -SCROLL_STEP
    if (hoveredPanel === 'nav' && navScrollEl()){
      navScrollEl().scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    } else if (hoveredPanel === 'main'){
      window.scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    }
  })
})()

/* =============== SEGMENTED FILTER: fade-hint on horizontal scroll =============== */
/* Hides the right-edge fade once the row is scrolled to its end, so it doesn't
   sit over the last tab forever. Re-checks on resize since it affects overflow. */
;(function setupSegmentedScrollFade(){
  function checkWrap(wrap){
    const seg = wrap.querySelector('.segmented')
    if (!seg) return
    const atEnd = seg.scrollWidth - seg.scrollLeft - seg.clientWidth < 2
    wrap.classList.toggle('at-end', atEnd || seg.scrollWidth <= seg.clientWidth)
  }
  function wireWrap(wrap){
    const seg = wrap.querySelector('.segmented')
    if (!seg || wrap.dataset.fadeWired === '1') return
    wrap.dataset.fadeWired = '1'
    checkWrap(wrap)
    seg.addEventListener('scroll', () => checkWrap(wrap), { passive:true })
  }
  function scan(){ document.querySelectorAll('.segmented-wrap').forEach(wireWrap) }
  scan()
  window.addEventListener('resize', () => document.querySelectorAll('.segmented-wrap').forEach(checkWrap))
  // Filter rows for pages loaded/rendered after initial paint still get wired.
  var obs = new MutationObserver(() => scan())
  obs.observe(document.body, { childList:true, subtree:true })
})()

init()
