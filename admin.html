<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ATBU MediCare — Admin Dashboard</title>
<script>
  (function(){
    try {
      var t = localStorage.getItem('atbu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/duotone/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
<style>
:root{
  --primary:#1E7FB8; --primary-mid:#2C97D6; --primary-light:#5CB8E4;
  --accent-green:#1E8449; --accent-gold:#F4C430;
  --bg:#F0F9FD; --panel-bg:#FFFFFF; --neu-bg:#FFFFFF;
  --neu-shadow-d:#c9e4f0; --neu-shadow-l:#ffffff;
  --text:#0F172A; --text-muted:#64748B;
  --input-bg:#FFFFFF; --input-border:#CBD5E1; --input-bg-err:#FEF2F2;
  --card-border:rgba(255,255,255,0.80); --card-border-solid:#CBD5E1;
  --success:#1E8449; --error:#EF4444; --warning:#F59E0B; --info:#2563EB; --white:#FFFFFF;
  --shadow-rgb:30,127,184;
  --radius-card:20px; --radius-input:12px; --radius-btn:10px;
  --overlay-grad:linear-gradient(150deg,#2C97D6 0%,#1E7FB8 100%);
  --brand-grad:linear-gradient(135deg,#2C97D6 0%,#1E7FB8 100%);
  --content-max:1200px;
  --med-icon:rgba(30,127,184,0.10);
}
[data-theme="dark"]{
  --primary:#5CB8E4; --primary-mid:#2C97D6; --primary-light:#8ECFEE;
  --accent-green:#2FA05E; --accent-gold:#F4C430;
  --bg:#0E1A22; --panel-bg:#142833; --neu-bg:#12242E;
  --neu-shadow-d:#081117; --neu-shadow-l:#1E3A48;
  --text:#EAF6FB; --text-muted:#8FB3C3;
  --input-bg:#102530; --input-border:#28455A; --input-bg-err:#2A1018;
  --card-border:rgba(92,184,228,0.22); --card-border-solid:#22364A;
  --success:#2FA05E; --error:#F87171; --warning:#FBBF24; --info:#60A5FA; --white:#EAF6FB;
  --shadow-rgb:92,184,228;
  --overlay-grad:linear-gradient(150deg,#5CB8E4 0%,#1E7FB8 100%);
  --brand-grad:linear-gradient(135deg,#5CB8E4 0%,#1E7FB8 100%);
  --med-icon:rgba(92,184,228,0.14);
  --stat-amber:#FBBF24; --stat-blue:#60A5FA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
.drawer-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;}
html,body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;transition:background 250ms ease,color 250ms ease}
body{overflow-x:hidden;overscroll-behavior-y:none}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.blob1{width:500px;height:500px;background:rgba(16,185,129,0.12);top:-150px;left:-150px;animation:blobDrift1 22s ease-in-out infinite alternate}
.blob2{width:420px;height:420px;background:rgba(var(--shadow-rgb),0.10);bottom:-120px;right:-120px;filter:blur(80px);animation:blobDrift2 18s ease-in-out infinite alternate}
@keyframes blobDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,80px) scale(1.15)}}
@keyframes blobDrift2{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-100px,-60px) scale(1)}}

/* Medical snow background */
.med-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.med-bg i{position:absolute;color:var(--med-icon);font-size:26px;top:-40px;animation:medFall linear infinite;opacity:.9}
@keyframes medFall{
  0%{transform:translateY(-40px) rotate(0deg);opacity:0}
  10%{opacity:.9}
  90%{opacity:.9}
  100%{transform:translateY(105vh) rotate(360deg);opacity:0}
}
.receipt-med-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--radius-card);z-index:0}
.receipt-med-bg i{position:absolute;color:var(--med-icon);font-size:22px;top:-30px;animation:medFall linear infinite;opacity:.8}
@media print{
  .med-bg,.receipt-med-bg,.blob{display:none !important}
}

#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;font-size:16px;color:var(--text-muted);gap:14px;position:relative;z-index:1;padding:20px;text-align:center}
#authScreen .auth-logo-pulse{animation:authLogoPulse 0.85s cubic-bezier(0.45,0,0.55,1) infinite}
#authScreen img{width:64px;height:64px;border-radius:14px;box-shadow:0 6px 20px rgba(var(--shadow-rgb),0.35)}
@keyframes authLogoPulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 0.8s linear infinite}

.layout{position:relative;z-index:1}
.topbar-shell{position:fixed;top:0;left:0;right:0;z-index:90;max-width:var(--content-max);margin:12px auto 0;padding-inline:clamp(64px,10vw,120px);pointer-events:none}
@media(min-width:769px){
  .topbar-shell{max-width:none;margin:14px 16px 0;padding-inline:0}
}
.topbar{position:relative;width:100%;padding:10px 20px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.12);display:flex;align-items:center;gap:14px;pointer-events:auto;transition:box-shadow 260ms ease}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;overflow:hidden;flex-shrink:0}
.brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:800;font-size:15px;color:var(--text);line-height:1.1;letter-spacing:.01em}
.brand-kicker{font-weight:700;font-size:10px;color:var(--primary-mid);text-transform:uppercase;letter-spacing:0.12em;margin-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text);cursor:pointer;font-size:18px;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.icon-btn:hover{transform:translateY(-2px) scale(1.08);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.18);border-color:var(--primary)}
.icon-btn:active{transform:translateY(0) scale(0.95)}
.icon-btn i{transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1)}
.icon-btn:hover i{transform:rotate(-8deg)}
.logout-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);font:600 13px 'Poppins';cursor:pointer;transition:all 180ms ease}
.logout-btn:hover{background:rgba(239,68,68,0.18)}
.desktop-logout-btn{display:inline-flex}
@media(max-width:768px){.desktop-logout-btn{display:none}}
.hamburger{display:none}

.topnav-strip-wrapper{position:fixed;top:78px;z-index:89;left:0;right:0;max-width:var(--content-max);margin:14px auto 0;padding-inline:clamp(64px,10vw,120px);pointer-events:none}
.topnav-strip-outer{padding:14px 16px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--card-border-solid);border-radius:24px;box-shadow:0 8px 24px rgba(var(--shadow-rgb),0.08);pointer-events:auto}
.topnav-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.nav-item{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;min-height:44px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:10px;color:var(--text-muted);font:700 13px 'Poppins',sans-serif;opacity:.6;cursor:pointer;transition:all 200ms ease}
.nav-item i{font-size:18px}
.nav-item:hover{opacity:.9;transform:translateY(-1px)}
.nav-item.active{color:#fff;border-color:transparent;background:var(--brand-grad);box-shadow:0 6px 20px rgba(var(--shadow-rgb),0.40);opacity:1}

/* ===================== DESKTOP ISLAND SIDEBAR ===================== */
/* Matches patient dashboard's .island component exactly (profile block with
   name + role badge, nav with icon+label rows, footer with text lines),
   adapted to admin's existing element ids (islandNav / islandNavList). */
@media(min-width:769px){
  .topnav-strip-wrapper{display:none !important}
}
:root{ --island-w-collapsed:68px; --island-w-expanded:250px; }
.island-nav{
  display:none;
  position:fixed; top:var(--main-top-offset,90px); bottom:12px; left:16px; z-index:88;
  width:var(--island-w-expanded);
  background:color-mix(in srgb, var(--panel-bg) 86%, transparent);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1.5px solid var(--card-border-solid); border-radius:var(--radius-card);
  box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.14);
  flex-direction:column; overflow:hidden;
  transition:box-shadow 260ms ease;
}
@media(min-width:769px){ .island-nav{ display:flex } }
.island-label{ display:inline-block; opacity:1; }

.island-profile{ display:flex; align-items:center; gap:10px; padding:10px 14px 16px; flex-shrink:0; min-width:0; cursor:default; transition:transform 220ms ease }
.island-profile:hover{ transform:translateX(2px) }
.island-avatar{
  width:38px; height:38px; border-radius:50%; background:var(--brand-grad); color:#fff;
  display:flex; align-items:center; justify-content:center; font:800 14px 'Poppins',sans-serif;
  flex-shrink:0; box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.30);
  transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 260ms ease;
}
.island-avatar i{ font-size:18px; }
.island-profile:hover .island-avatar{ transform:scale(1.08) rotate(-4deg); box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.45) }
.island-profile-meta{ min-width:0; overflow:hidden }
.island-profile-name{ font:700 13.5px 'Poppins',sans-serif; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.island-profile-badge{
  display:inline-block; margin-top:3px; font:700 10px 'Poppins',sans-serif; text-transform:uppercase; letter-spacing:.06em;
  color:var(--primary); background:rgba(var(--shadow-rgb),0.10); border-radius:10px; padding:2px 8px; white-space:nowrap;
  transition:background 220ms ease, letter-spacing 220ms ease;
}
.island-profile:hover .island-profile-badge{ background:rgba(var(--shadow-rgb),0.18); letter-spacing:.09em }

.island-divider{ height:1px; background:var(--card-border-solid); margin:0 14px; flex-shrink:0; opacity:.7 }

.island-nav-list{ flex:1; display:flex; flex-direction:column; gap:6px; padding:14px 10px; overflow-y:auto; overflow-x:hidden; min-height:0; scrollbar-width:none }
.island-nav-list::-webkit-scrollbar{ display:none }
.island-nav-item{
  position:relative; display:flex; align-items:center; gap:12px; min-height:44px;
  border-radius:14px; padding:0 13px; color:var(--text-muted); background:transparent; border:none;
  cursor:pointer; font:700 13px 'Poppins',sans-serif; transition:background 220ms ease, color 220ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 220ms ease;
  text-align:left; width:100%; justify-content:flex-start;
  opacity:0; transform:translateX(-10px); animation:islandItemIn 420ms ease forwards;
}
@keyframes islandItemIn{ to{ opacity:1; transform:translateX(0) } }
.island-nav-item:nth-child(1){ animation-delay:40ms }
.island-nav-item:nth-child(2){ animation-delay:80ms }
.island-nav-item:nth-child(3){ animation-delay:120ms }
.island-nav-item:nth-child(4){ animation-delay:160ms }
.island-nav-item:nth-child(5){ animation-delay:200ms }
.island-nav-item:nth-child(6){ animation-delay:240ms }
.island-nav-item:nth-child(7){ animation-delay:280ms }
.island-nav-item:nth-child(8){ animation-delay:320ms }
.island-nav-item i{ font-size:19px; flex-shrink:0; width:22px; text-align:center; transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1) }
.island-nav-item:hover{ background:rgba(var(--shadow-rgb),0.08); color:var(--text); transform:translateX(4px) }
.island-nav-item:hover i{ transform:scale(1.15) rotate(-6deg) }
.island-nav-item:active{ transform:translateX(4px) scale(0.97) }
.island-nav-item.active{ background:rgba(var(--shadow-rgb),0.12); color:var(--primary); box-shadow:0 2px 10px rgba(var(--shadow-rgb),0.10) }
.island-nav-item.active::before{
  content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0; background:var(--brand-grad);
  transition:top 260ms cubic-bezier(0.34,1.56,0.64,1), bottom 260ms cubic-bezier(0.34,1.56,0.64,1);
}
.island-nav-item:focus-visible{ outline:2px solid var(--primary); outline-offset:2px }

.island-footer{ flex-shrink:0; padding:14px; display:flex; align-items:center; gap:10px; min-width:0; cursor:default; transition:transform 220ms ease }
.island-footer:hover{ transform:translateX(2px) }
.island-footer-glyph{
  width:30px; height:30px; border-radius:9px; background:rgba(var(--shadow-rgb),0.10); color:var(--primary);
  display:flex; align-items:center; justify-content:center; font:800 11px 'Poppins',sans-serif; flex-shrink:0;
  transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1);
}
.island-footer:hover .island-footer-glyph{ transform:scale(1.08) rotate(4deg) }
.island-footer-lines{ min-width:0; overflow:hidden }
.island-footer-lines div{ font-size:10.5px; line-height:1.5; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.island-footer-lines div:first-child{ font-weight:700; color:var(--text) }
@media (prefers-reduced-motion:reduce){
  .island-nav-item{ opacity:1; transform:none; animation:none }
  .island-profile, .island-footer, .island-avatar, .island-footer-glyph, .island-profile-badge, .island-nav-item i{ transition:none }
}

.main{max-width:var(--content-max);margin:0 auto 60px;padding:clamp(24px,5vw,60px) clamp(64px,10vw,120px);padding-top:var(--main-top-offset,200px);position:relative;z-index:1}
@media(min-width:769px){ .main{ max-width:none; padding-left:calc(16px + var(--island-w-expanded) + 24px); padding-right:32px } }
.page{display:none}
.page.active{display:block;animation:fadeUp 420ms cubic-bezier(0.22,1,0.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){ .page.active{ animation:none } }

.page-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.page-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand-grad)}
.page-title-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;font-weight:500}
.page-header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header-row .page-title{margin-bottom:0}
.appt-header-row{align-items:center}
#page-appointments .page-title{margin-bottom:14px}
.page-header-actions{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.page-header-actions .custom-select-wrap{display:flex}
.page-header-actions .custom-select-trigger{height:42px;padding-top:0;padding-bottom:0}
.page-header-actions .btn-primary{height:42px;padding-top:0;padding-bottom:0}
.page-header-actions .icon-btn{height:42px;width:42px;flex-shrink:0}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:28px}
.stat-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 6px rgba(0,0,0,0.04),0 10px 24px rgba(var(--shadow-rgb),0.08);position:relative;overflow:hidden;transition:transform 260ms cubic-bezier(0.34,1.4,0.64,1),box-shadow 260ms ease,border-color 260ms ease}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand-grad);opacity:.35;transition:opacity 220ms ease}
.stat-card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 8px 16px rgba(0,0,0,0.06),0 18px 38px rgba(var(--shadow-rgb),0.18);border-color:rgba(var(--shadow-rgb),0.35)}
.stat-card:hover::before{opacity:1}
.stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(13,107,78,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);font-size:22px;flex-shrink:0;transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1)}
.stat-card:hover .stat-icon{transform:scale(1.1) rotate(-6deg)}
.stat-icon.amber{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(245,158,11,0.08));border-color:rgba(245,158,11,0.25);color:var(--stat-amber,#F59E0B)}
.stat-icon.blue{background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(37,99,235,0.08));border-color:rgba(37,99,235,0.25);color:var(--stat-blue,#2563EB)}
[data-theme="dark"] .stat-icon.amber{background:linear-gradient(135deg,rgba(251,191,36,0.22),rgba(251,191,36,0.10));border-color:rgba(251,191,36,0.30)}
[data-theme="dark"] .stat-icon.blue{background:linear-gradient(135deg,rgba(96,165,250,0.22),rgba(96,165,250,0.10));border-color:rgba(96,165,250,0.30)}
.stat-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-value{font-size:28px;font-weight:800;color:var(--text);line-height:1.1}
.stat-value.small{font-size:18px;line-height:1.2}
.stat-value .badge{margin-left:8px;vertical-align:middle;font-size:10px;padding:2px 8px}
@media(max-width:480px){.stat-grid{grid-template-columns:1fr}}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title{font-size:15px;font-weight:700;color:var(--text)}

.btn-primary{background:var(--brand-grad);color:#fff;border:none;border-radius:10px;padding:10px 20px;font:600 13px 'Poppins';box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.35);cursor:pointer;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1);display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.45)}
.btn-primary:active{transform:translateY(0) scale(0.98)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary i{transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1)}
.btn-primary:hover i{transform:scale(1.15) rotate(-6deg)}
.btn-secondary{background:var(--panel-bg);color:var(--text);border:1.5px solid var(--card-border-solid);border-radius:10px;padding:10px 20px;font:600 13px 'Poppins';cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.segmented{display:flex;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative}
.segmented::-webkit-scrollbar{display:none}
.segmented-btn{border:none;background:transparent;color:var(--text-muted);font:600 12px 'Poppins';padding:7px 16px;border-radius:10px;cursor:pointer;transition:all 180ms ease;flex-shrink:0;white-space:nowrap}
.segmented-btn.active{background:var(--brand-grad);color:#fff}
.segmented-wrap{position:relative}
.segmented-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:28px;border-radius:0 10px 10px 0;background:linear-gradient(to right, transparent, var(--panel-bg) 70%);pointer-events:none;opacity:1;transition:opacity 160ms ease}
.segmented-wrap.at-end::after{opacity:0}
.btn-secondary:hover{background:color-mix(in srgb, var(--primary) 6%, var(--panel-bg));transform:translateY(-2px) scale(1.03);border-color:var(--primary)}
.btn-secondary:active{transform:translateY(0) scale(0.98)}
.btn-danger{background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);border-radius:10px;padding:8px 16px;font:600 12px 'Poppins';cursor:pointer;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.btn-danger:hover{background:rgba(239,68,68,0.20);transform:translateY(-2px) scale(1.03)}
.btn-danger:active{transform:translateY(0) scale(0.98)}
.btn-sm{padding:6px 12px;font-size:12px}
.icon-btn.eye-btn{width:32px;height:32px;font-size:15px;color:var(--primary)}

.table-wrap{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);overflow:hidden;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06)}
.table-scroll{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(var(--shadow-rgb),0.06);padding:12px 16px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:700;border-bottom:1.5px solid var(--card-border-solid);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--card-border-solid);color:var(--text);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(odd) td{background:rgba(255,255,255,0.6)}
tbody tr:nth-child(even) td{background:rgba(16,185,129,0.04)}
[data-theme="dark"] tbody tr:nth-child(odd) td{background:rgba(255,255,255,0.02)}
[data-theme="dark"] tbody tr:nth-child(even) td{background:rgba(46,204,143,0.05)}
td{transition:background 200ms ease}
tbody tr:hover td{background:rgba(var(--shadow-rgb),0.08) !important}
td.cell-id{font-family:'Poppins',monospace;font-weight:700;font-style:italic;color:var(--primary);font-size:12.5px;letter-spacing:.04em}
td.cell-date{font-weight:700;font-style:italic;color:var(--text);letter-spacing:.03em}
.pay-drugs{font-size:11.5px;color:var(--text-muted);margin-top:2px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.pending,.badge.unpaid{color:#F59E0B;background:rgba(245,158,11,0.12)}
.badge.approved,.badge.active,.badge.paid{color:#1E8449;background:rgba(30,132,73,0.12)}
.badge.cancelled,.badge.missed{color:#EF4444;background:rgba(239,68,68,0.12)}
.badge.deactivated{color:var(--text-muted);background:rgba(148,163,184,0.16)}
.badge.completed,.badge.dispensed,.badge.pending_verification{color:#2563EB;background:rgba(37,99,235,0.12)}
.badge.locked{color:var(--text-muted);background:rgba(148,163,184,0.16);gap:5px}

.form-wrap{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;margin-bottom:24px;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-field{display:flex;flex-direction:column;min-width:0}
.form-field.full{grid-column:1 / -1}
.form-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Poppins',sans-serif;transition:border-color 180ms ease,box-shadow 180ms ease}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15);outline:none}
.form-textarea{min-height:90px;resize:vertical}
.form-actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.disclaimer{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:12px}
.form-input.is-invalid,.form-textarea.is-invalid,.custom-select-wrap.is-invalid .custom-select-trigger{border-color:var(--error) !important;background:var(--input-bg-err)}
.field-error{font-size:11.5px;color:var(--error);margin-top:5px;font-weight:600;display:none}
.field-error.show{display:block}
.form-input.is-muted,.custom-select-wrap.is-muted .custom-select-trigger{background:rgba(148,163,184,0.10);color:var(--text-muted);cursor:not-allowed;opacity:.85}
.form-input:disabled,.form-input[readonly]{background:rgba(148,163,184,0.10);color:var(--text-muted);cursor:not-allowed}

.state-box{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:14px}
.state-box i{font-size:36px;display:block;margin-bottom:10px;color:var(--text-muted);opacity:.7}
.state-box .cta{margin-top:14px}

/* Skeleton shimmer */
.sk{position:relative;overflow:hidden;background:rgba(148,163,184,0.14);border-radius:8px;display:inline-block}
[data-theme="dark"] .sk{background:rgba(255,255,255,0.06)}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);animation:shimmer 1.4s infinite}
[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sk-line{display:block;height:12px;border-radius:6px;margin:4px 0}
.sk-stat{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;display:flex;align-items:center;gap:16px}
.sk-stat .sk-circle{width:48px;height:48px;border-radius:14px}
.sk-stat .sk-meta{flex:1}
.sk-row{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--card-border-solid)}
.sk-row .sk-line{flex:1}
.sk-rx{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:18px 22px;margin-bottom:12px}

/* Slot cards */
.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px}
.slot-card{background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all 180ms ease;position:relative}
.slot-card:hover:not(.disabled){border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.15)}
.slot-card.selected{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 8%, var(--panel-bg));box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.20)}
.slot-card.disabled{opacity:.5;cursor:not-allowed}
.slot-date{font-weight:700;font-size:13px;color:var(--text)}
.slot-shift{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.slot-spots{font-size:12px;color:var(--primary);font-weight:600;margin-top:2px}

/* Prescription accordion */
.rx-list{display:flex;flex-direction:column;gap:12px}
.rx-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-left:4px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);overflow:hidden;transition:box-shadow 260ms ease,transform 260ms cubic-bezier(0.34,1.4,0.64,1)}
.rx-card[data-status="active"]{border-left-color:var(--success)}
.rx-card[data-status="dispensed"]{border-left-color:var(--info)}
.rx-card[data-status="cancelled"]{border-left-color:var(--error)}
.rx-card[data-status="pending"]{border-left-color:var(--warning,#F59E0B)}
.rx-card:hover{box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.10);transform:translateY(-2px)}
.rx-card.open{box-shadow:0 8px 24px rgba(var(--shadow-rgb),0.12)}
.rx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;cursor:pointer;flex-wrap:wrap}
.rx-head-left{display:flex;align-items:center;gap:12px;min-width:0}
.rx-head-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(13,107,78,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rx-head-txt{min-width:0}
.rx-head-title{font-weight:700;font-size:14px;color:var(--text)}
.rx-head-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.rx-head-right{display:flex;align-items:center;gap:10px}
.rx-chevron{color:var(--text-muted);font-size:18px;transition:transform 260ms ease}
.rx-card.open .rx-chevron{transform:rotate(180deg)}
.rx-body{max-height:0;overflow:hidden;transition:max-height 320ms cubic-bezier(0.34,1.1,0.64,1);padding:0 22px}
.rx-card.open .rx-body{max-height:1600px;padding-bottom:18px}
.rx-items{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.rx-item{background:var(--neu-bg);border:1px solid var(--card-border-solid);border-radius:12px;padding:10px 14px;font-size:13px}
.rx-item strong{color:var(--text);font-weight:700}
.rx-item-instructions{display:flex;align-items:flex-start;gap:8px;color:var(--text)}
.rx-item-instructions i{font-size:16px;color:var(--primary);flex-shrink:0;margin-top:1px}
.rx-item-purchase{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:11.5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--card-border-solid)}
.rx-item-purchase i{font-size:13px;flex-shrink:0}
.rx-notice{margin-bottom:12px;padding:10px 14px;background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.22);border-radius:12px;color:var(--info);font-size:12.5px;display:flex;align-items:flex-start;gap:8px}

/* Prescriptions sub-tabs (Transactions / Medical Instructions) */

/* Medical instructions accordion (drug table per prescription) */
.rx-med-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);overflow:hidden;margin-bottom:14px;transition:box-shadow 260ms ease,transform 260ms cubic-bezier(0.34,1.4,0.64,1)}
.rx-med-card:hover{box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.10);transform:translateY(-2px)}
.rx-med-card.open{box-shadow:0 8px 24px rgba(var(--shadow-rgb),0.12)}
.rx-med-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;cursor:pointer;flex-wrap:wrap}
.rx-med-title{font-weight:700;font-size:14px;color:var(--text)}
.rx-med-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.rx-med-chevron{color:var(--text-muted);font-size:18px;transition:transform 260ms ease;flex-shrink:0}
.rx-med-card.open .rx-med-chevron{transform:rotate(180deg)}
.rx-med-body{max-height:0;overflow:hidden;transition:max-height 320ms cubic-bezier(0.34,1.1,0.64,1);padding:0 22px}
.rx-med-card.open .rx-med-body{max-height:1600px;padding-bottom:20px}
.rx-med-advice{margin-bottom:12px;padding:10px 14px;background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.22);border-radius:12px;color:var(--info);font-size:12.5px;display:flex;align-items:flex-start;gap:8px}
[data-theme="dark"] .rx-med-advice{color:#93C5FD}
.rx-med-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rx-med-table{width:100%;min-width:520px;font-size:13px;border-collapse:collapse}
.rx-med-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:8px 10px;border-bottom:1.5px solid var(--card-border-solid);white-space:nowrap}
.rx-med-table td{padding:9px 10px;border-bottom:1px solid var(--card-border-solid);color:var(--text);white-space:nowrap}
.rx-med-table tr:last-child td{border-bottom:none}
.rx-med-drug{display:flex;align-items:center;gap:8px}
.rx-med-drug i{color:var(--primary);font-size:16px;flex-shrink:0}

.pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;flex-wrap:wrap;gap:10px}
.pagination-info{font-size:12px;color:var(--text-muted)}
.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-pill{min-width:34px;height:34px;padding:0 10px;border-radius:10px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text-muted);font:600 12px 'Poppins';cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.page-pill:hover:not(:disabled){color:var(--text);transform:translateY(-2px) scale(1.06);border-color:var(--primary)}
.page-pill.active{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.30)}
.page-pill:disabled{opacity:.4;cursor:not-allowed}

/* ============ TOASTS (pill capsule) ============ */
#toastContainer{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:520px;padding:16px 16px 0;box-sizing:border-box;pointer-events:none}
:root{
  --warn-ic:#F59E0B; --warn-tint:#FEF3E2; --warn-text:#7C4A03;
  --info-ic:#2563EB; --info-tint:#E3EFFE; --info-text:#1E3A6E;
  --succ-ic:#16A34A; --succ-tint:#E4F6EA; --succ-text:#14532D;
  --err-ic:#EF4444;  --err-tint:#FDE9E9;  --err-text:#7A1F1F;
}
[data-theme="dark"]{
  --warn-tint:#3A2C0E; --warn-text:#F5D48A;
  --info-tint:#122644; --info-text:#AFCBFB;
  --succ-tint:#123421; --succ-text:#9EE6BA;
  --err-tint:#3A1616;  --err-text:#F7B4B4;
}
.toast{
  background:var(--warn-tint);border-radius:16px;border:none;
  box-shadow:0 8px 24px rgba(15,23,42,0.12);
  padding:12px 44px 12px 14px;display:flex;gap:10px;align-items:center;position:relative;
  opacity:0;transform:translateY(-120%);
  transition:transform .55s cubic-bezier(0.34,1.56,0.64,1),opacity .25s;
  pointer-events:auto;touch-action:none;cursor:grab;width:fit-content;max-width:100%
}
.toast.is-dragging{cursor:grabbing;transition:none !important}
.toast.show{opacity:1;transform:translateY(0)}
.toast.hide{opacity:0;transform:translateY(-120%)}
.toast .toast-icon{width:26px;height:26px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;background:var(--warn-ic)}
.toast-text{font-weight:600;font-size:0.9rem;line-height:1.3;color:var(--warn-text);white-space:normal;overflow-wrap:break-word}
.toast.t-info{background:var(--info-tint)}
.toast.t-info .toast-icon{background:var(--info-ic)}
.toast.t-info .toast-text{color:var(--info-text)}
.toast.t-success{background:var(--succ-tint)}
.toast.t-success .toast-icon{background:var(--succ-ic)}
.toast.t-success .toast-text{color:var(--succ-text)}
.toast.t-error{background:var(--err-tint)}
.toast.t-error .toast-icon{background:var(--err-ic)}
.toast.t-error .toast-text{color:var(--err-text)}
.toast.t-warning .toast-text{color:var(--warn-text)}
.toast-close{position:absolute;top:50%;right:12px;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;color:inherit;opacity:.5;font-size:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.toast-close:hover{opacity:.9;background:rgba(0,0,0,0.06)}
@media(max-width:640px){
  #toastContainer{padding:12px 12px 0;max-width:100%}
  .toast{padding:10px 38px 10px 12px;gap:8px;width:100%}
  .toast .toast-icon{width:24px;height:24px;font-size:13px}
  .toast-text{font-size:0.84rem}
}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.45);backdrop-filter:blur(10px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 200ms ease;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1);max-height:90vh;max-height:90dvh;overflow-y:auto;position:relative}
.modal-card.wide{max-width:560px}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes popInCentered{from{transform:translate(-50%,-50%) scale(.92);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.modal-msg{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-branded-head{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:16px;border-bottom:2px dashed var(--card-border-solid)}
.modal-branded-head .brand-icon{width:46px;height:46px}
.modal-branded-head h3{font-size:16px;font-weight:800;color:var(--primary);margin:0;line-height:1.2}
.modal-branded-head p{font-size:11.5px;color:var(--text-muted);margin-top:2px}

/* Wizard */
.wizard-progress{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.wiz-dot{width:10px;height:10px;border-radius:50%;background:var(--card-border-solid);transition:all 220ms ease}
.wiz-dot.active{background:var(--brand-grad);width:28px;border-radius:6px;box-shadow:0 2px 8px rgba(var(--shadow-rgb),0.35)}
.wiz-dot.done{background:var(--primary)}
.wiz-step{display:none;animation:fadeUp 300ms ease}
.wiz-step.active{display:block}
.wiz-step h4{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.wiz-step h4 i{color:var(--primary);font-size:18px}
.wiz-review{background:var(--neu-bg);border:1px solid var(--card-border-solid);border-radius:12px;padding:14px}
.wiz-review .rvw-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;gap:12px}
.wiz-review .rvw-row strong{color:var(--text-muted);font-weight:600}
.wiz-review .rvw-row span{color:var(--text);font-weight:600;text-align:right}

/* Receipt */
.receipt-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:32px;max-width:480px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1);position:relative;overflow:hidden}
.receipt-inner{position:relative;z-index:2}
.receipt-head{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:2px dashed var(--card-border-solid)}
.receipt-head .brand-icon{margin:0 auto 10px}
.receipt-head h2{font-size:20px;font-weight:800;color:var(--primary);margin-bottom:4px}
.receipt-head p{font-size:12px;color:var(--text-muted)}
.receipt-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--card-border-solid);gap:12px}
.receipt-row strong{color:var(--text);font-weight:600}
.receipt-row span{color:var(--text-muted);text-align:right;word-break:break-all}
.receipt-amount{font-size:22px;font-weight:800;color:var(--primary);text-align:center;margin:18px 0;padding:14px;background:rgba(16,185,129,0.08);border-radius:14px}

.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.35);backdrop-filter:blur(10px);z-index:95;opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 280ms ease}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,320px);background:var(--panel-bg);border-left:1px solid var(--card-border);border-top-left-radius:24px;border-bottom-left-radius:24px;box-shadow:-20px 0 50px rgba(0,0,0,0.25);transform:translateX(110%);transition:transform 380ms cubic-bezier(0.34,1.2,0.64,1);z-index:96;display:flex;flex-direction:column;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.drawer-nav{display:flex;flex-direction:column;gap:8px;padding:14px 4px;overflow-y:auto;flex:1}
.drawer-nav .nav-item{justify-content:flex-start;width:100%;border-radius:10px;padding:12px 16px;min-height:0;font-size:14px;font-weight:500;background:var(--bg);border:none;color:var(--text);box-shadow:none;opacity:1 !important}
.drawer-nav .nav-item:hover,.drawer-nav .nav-item.active{background:var(--brand-grad);color:#fff}
.drawer-foot{padding-top:14px;border-top:1px solid var(--card-border-solid)}

/* Custom select */
.custom-select-wrap{position:relative;width:100%;font-family:'Poppins',sans-serif;z-index:1}
.custom-select-wrap.open{z-index:100}
.custom-select-trigger{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:border-color 180ms ease,box-shadow 180ms ease;text-align:left}
.custom-select-trigger:hover{border-color:var(--primary)}
.custom-select-wrap.open .custom-select-trigger{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15)}
.custom-select-trigger .cs-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-select-trigger .cs-label.placeholder{color:var(--text-muted)}
.custom-select-trigger .cs-caret{transition:transform 220ms ease;color:var(--text-muted);font-size:18px;flex-shrink:0}
.custom-select-wrap.open .cs-caret{transform:rotate(180deg);color:var(--primary)}
.custom-select-options{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-input);box-shadow:0 12px 30px rgba(var(--shadow-rgb),0.18);padding:6px;z-index:200;max-height:0;overflow:hidden;opacity:0;transform:translateY(-6px) scaleY(0.96);transform-origin:top center;transition:max-height 240ms cubic-bezier(0.34,1.2,0.64,1),opacity 200ms ease,transform 220ms cubic-bezier(0.34,1.2,0.64,1),padding 200ms ease;pointer-events:none}
.custom-select-wrap.open .custom-select-options{max-height:280px;overflow-y:auto;opacity:1;transform:translateY(0) scaleY(1);pointer-events:auto}
.cs-option{padding:10px 12px;border-radius:8px;font:500 13px 'Poppins',sans-serif;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:background 140ms ease}
.cs-option:hover,.cs-option.focused{background:color-mix(in srgb, var(--primary) 8%, var(--panel-bg))}
.cs-option.active{color:var(--primary);font-weight:700;background:color-mix(in srgb, var(--primary) 10%, var(--panel-bg))}
.cs-option.disabled{color:var(--text-muted);cursor:not-allowed;opacity:.7}

/* Custom calendar */
.cal-input{cursor:pointer;position:relative}
.cal-input i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.cal-popover{position:absolute;top:calc(100% + 6px);left:0;z-index:300;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-input);box-shadow:0 20px 50px rgba(var(--shadow-rgb),0.20);padding:14px;width:290px;user-select:none;-webkit-user-select:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cal-title{font-weight:700;font-size:13px;color:var(--text);flex:1;text-align:center}
.cal-title-selects{display:flex;gap:6px;justify-content:center;align-items:center}
.cal-jump{font:700 12px 'Poppins',sans-serif;color:var(--text);background:var(--neu-bg);border:1px solid var(--card-border-solid);border-radius:8px;padding:5px 6px;cursor:pointer;max-width:88px}
.cal-jump-year{max-width:74px}
.cal-jump:hover{border-color:var(--primary)}
.cal-nav-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.cal-nav-btn:hover{background:color-mix(in srgb, var(--primary) 8%, var(--panel-bg))}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;text-align:center;color:var(--text-muted);font-weight:700;text-transform:uppercase;padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);cursor:pointer;border-radius:8px;font-weight:500;border:1.5px solid transparent}
.cal-day:hover:not(.disabled):not(.other){background:color-mix(in srgb, var(--primary) 10%, var(--panel-bg))}
.cal-day.other{color:var(--text-muted);opacity:.4}
.cal-day.today{border-color:var(--primary)}
.cal-day.selected{background:var(--brand-grad);color:#fff;font-weight:700}
.cal-day.focused{outline:2px solid var(--primary);outline-offset:1px}
.cal-day.disabled{color:var(--text-muted);opacity:.35;cursor:not-allowed}
.cal-foot{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.cal-btn{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:10px;border:1px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text);cursor:pointer}
.cal-btn.primary{background:var(--brand-grad);color:#fff;border-color:transparent}

/* Profile banner + accordion */
.profile-banner{background:linear-gradient(135deg,rgba(16,185,129,0.14),rgba(13,107,78,0.08));border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;display:flex;align-items:center;gap:18px;margin-bottom:20px;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.10);flex-wrap:wrap}
.pb-avatar{width:76px;height:76px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.30);flex-shrink:0}
.pb-info{flex:1;min-width:0}
.pb-name{font-size:20px;font-weight:800;color:var(--text)}
.pb-email{font-size:13px;color:var(--text-muted);margin-top:2px;word-break:break-all}
.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 0}
.fact-card{display:flex;align-items:flex-start;gap:10px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:12px 14px;min-width:0}
.fact-card.full{grid-column:1 / -1}
.fact-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(13,107,78,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.fact-meta{min-width:0}
.fact-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.fact-value{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;word-break:break-word}
@media(max-width:520px){.fact-grid{grid-template-columns:1fr}}
.profile-groups{display:flex;flex-direction:column;gap:16px}
.profile-group{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);overflow:hidden}
.pg-head{padding:16px 22px;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);cursor:pointer;user-select:none}
.pg-head i.pg-icon{color:var(--primary);font-size:18px}
.pg-head .pg-chev{margin-left:auto;color:var(--primary);font-size:20px;font-weight:700;transition:transform 260ms ease}
.profile-group.open .pg-chev{transform:rotate(180deg)}
.pg-head .pg-chev{color:var(--primary);font-size:20px;font-weight:700}
.pg-body{max-height:0;overflow:hidden;transition:max-height 320ms cubic-bezier(0.34,1.1,0.64,1);padding:0 22px}
.profile-group.open .pg-body{max-height:1200px;padding-bottom:20px}
@media(max-width:768px){
  .pg-head{padding:14px 18px}
}
.profile-save-bar{position:sticky;bottom:0;background:var(--panel-bg);border-top:1px solid var(--card-border-solid);padding:14px 20px;display:none;justify-content:flex-end;margin:16px -16px -16px;border-radius:0 0 var(--radius-card) var(--radius-card)}
@media(max-width:768px){
  .profile-save-bar{display:flex;position:fixed;left:0;right:0;bottom:0;margin:0;z-index:80;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(var(--shadow-rgb),0.12)}
  .desktop-save-actions{display:none}
}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand-grad);color:#fff;border:none;display:none;align-items:center;justify-content:center;font-size:26px;cursor:pointer;box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.45);z-index:85;transition:transform 200ms ease}
.fab:hover{transform:scale(1.05)}
.fab.show{display:flex;animation:popIn 300ms cubic-bezier(0.34,1.5,0.64,1)}

.wiz-empty{padding:20px;text-align:center;color:var(--text-muted);font-size:13px}

@media (max-width: 768px){
  .topnav-strip-wrapper{display:none}
  .hamburger{display:flex}
  .form-grid{grid-template-columns:1fr}
  .topbar-shell{margin:8px 10px 0;padding-inline:0;max-width:none}
  .main{padding:clamp(16px,4vw,32px);padding-top:var(--main-top-offset,90px);padding-bottom:100px}
  .page-title{font-size:20px}
  .brand-name{font-size:13px}
  .desktop-book-btn{display:none}
}
@media (min-width: 769px){
  .fab{display:none !important}
}
@media (max-width: 480px){
  .top-right .logout-btn span{display:none}
}

/* Refresh overlay shimmer */
.refresh-host{position:relative}
.refresh-host.refreshing::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0.2),rgba(255,255,255,0.55),rgba(255,255,255,0.2));background-size:200% 100%;animation:refreshShimmer 1.4s linear infinite;pointer-events:none;z-index:5;border-radius:inherit}
[data-theme="dark"] .refresh-host.refreshing::before{background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.12),rgba(255,255,255,0.04));background-size:200% 100%}
.refresh-host.refreshing > *{opacity:.55;transition:opacity 200ms ease;pointer-events:none}
@keyframes refreshShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===================== SHARED UI LANGUAGE (matches doctor dashboard) ===================== */
/* Accordion cards */
.appt-ac-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.rx-hist-card{border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);background:var(--panel-bg);overflow:hidden;transition:box-shadow 200ms ease}
.rx-hist-card.open{box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.10)}
.rx-hist-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--text)}
.rx-hist-head .rx-hist-ic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.rx-hist-head .rx-hist-meta{flex:1;min-width:0}
.rx-hist-head .rx-hist-code{font-weight:700;font-size:13.5px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rx-hist-head .rx-hist-code .ac-idline{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;flex:1}
.rx-hist-head .rx-hist-code .badge{flex-shrink:0;white-space:nowrap}
.rx-hist-head .rx-hist-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.rx-hist-chev{transition:transform 220ms ease;color:var(--text-muted);flex-shrink:0}
.rx-hist-card.open .rx-hist-chev{transform:rotate(180deg)}
.rx-hist-body{max-height:0;overflow:hidden;transition:max-height 260ms ease,padding 260ms ease;padding:0 14px}
.rx-hist-card.open .rx-hist-body{max-height:2600px;padding:0 14px 14px}
.rx-hist-items{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--card-border-solid);padding-top:10px}
.rx-hist-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 10px;border:1px solid var(--card-border-solid);border-radius:10px;background:var(--neu-bg);font-size:12.5px}
.rx-hist-item .rx-hist-drug{font-weight:700;color:var(--text)}
.rx-hist-item .rx-hist-qty{font-weight:600;color:var(--primary);font-size:12px;white-space:nowrap}
.rx-hist-item .rx-hist-detail{grid-column:1 / -1;color:var(--text-muted);font-size:12px;line-height:1.5}
@media(max-width:640px){.rx-hist-item{grid-template-columns:1fr}.rx-hist-item .rx-hist-qty{justify-self:start}}
.appt-ac .rx-hist-head{align-items:flex-start}
.ac-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;box-shadow:0 3px 10px rgba(var(--shadow-rgb),0.22);letter-spacing:.02em}
.ac-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:8px;background:color-mix(in srgb, var(--primary) 13%, transparent);color:var(--primary);border:1px solid color-mix(in srgb, var(--primary) 24%, transparent);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ac-name{font-weight:700;font-size:13.5px;color:var(--text);overflow-wrap:break-word;word-break:break-word;min-width:0}
.appt-ac .rx-hist-sub{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.appt-ac .rx-hist-sub span{display:inline-flex;align-items:center;gap:4px;min-width:0;flex-shrink:0;white-space:nowrap}
.appt-ac .rx-hist-sub .badge{flex-shrink:0}
.appt-ac .rx-hist-sub i{color:var(--primary);font-size:13px}
.ac-body-inner{display:grid;grid-template-columns:1fr;gap:12px 16px;border-top:1px dashed var(--card-border-solid);padding-top:12px}
.ac-span-2{grid-column:1 / -1}
@media(min-width:769px){
  .ac-body-inner{grid-template-columns:1fr 1fr}
}
.ac-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:4px}
.ac-v{font-size:13px;color:var(--text);overflow-wrap:break-word;word-break:break-word}
.roster-bar{margin-top:7px;height:9px;border-radius:10px;background:var(--neu-bg);border:1px solid var(--card-border-solid);overflow:hidden}
.roster-bar-fill{height:100%;border-radius:10px;transition:width 420ms cubic-bezier(0.34,1.1,0.64,1)}
.roster-bar-fill.low{background:var(--success)}
.roster-bar-fill.mid{background:var(--warning)}
.roster-bar-fill.high{background:var(--error)}
.ac-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.ac-rx-empty{font-size:12.5px;color:var(--text-muted);border:1px dashed var(--card-border-solid);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.ac-sk{border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);background:var(--panel-bg);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ac-sk .sk-circle{width:38px;height:38px;border-radius:50%}
.ac-sk .sk-meta{flex:1}

/* Patient lookup list */
.pat-search-box{position:relative;display:flex}
.pat-search-box .form-input{padding-right:44px}
.pat-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:10px;border:none;background:rgba(148,163,184,0.18);color:var(--text-muted);display:none;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.pat-search-clear.show{display:flex}
.pat-search-clear:hover{background:rgba(148,163,184,0.32);color:var(--text)}
.pat-list{display:flex;flex-direction:column;gap:8px}
.pat-list-item{display:flex;align-items:center;gap:12px;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:10px 14px;transition:all 160ms ease}
.pat-list-item:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.10)}
.pat-list-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-grad);color:#fff;font:800 13px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(var(--shadow-rgb),0.25)}
.pat-list-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.pat-list-name{min-width:0;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pat-list-sub{font-size:11.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.pat-list-sub span{display:inline-flex;align-items:center;gap:4px}
.pat-list-item .btn-primary{flex-shrink:0}
.pat-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:2px 0 10px;display:flex;align-items:center;gap:6px}
.pat-section-label i{color:var(--primary);font-size:14px}

/* Patient profile modal */
.pp-head{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:6px;border-bottom:2px dashed var(--card-border-solid)}
.pp-avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-grad);color:#fff;font:800 20px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px rgba(var(--shadow-rgb),0.28)}
.pp-head-meta{min-width:0;flex:1}
.pp-head-name{font-size:17px;font-weight:800;color:var(--text);overflow-wrap:break-word}
.pp-head-sub{font-size:12px;color:var(--text-muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px 12px}
.pp-head-sub span{display:inline-flex;align-items:center;gap:4px}
.pp-section{margin-top:18px}
.pp-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.pp-section-title .pp-ro{font-weight:500;font-size:10.5px;color:var(--text-muted);opacity:.8;text-transform:none;letter-spacing:0}
.pp-mr-card{background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:12px 16px}
.pp-mr-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--card-border-solid);font-size:13px}
.pp-mr-row:last-child{border-bottom:none}
.pp-mr-row strong{color:var(--text-muted);font-weight:600;flex-shrink:0}
.pp-mr-row span{color:var(--text);text-align:right;overflow-wrap:break-word;word-break:break-word;max-width:62%;white-space:pre-wrap}
.pp-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;background:var(--neu-bg);border:1px dashed var(--card-border-solid);border-radius:12px}
@media(max-width:520px){
  .pp-mr-card{background:transparent;border:none;padding:0;display:flex;flex-direction:column;gap:8px}
  .pp-mr-row{flex-direction:column;align-items:flex-start;gap:3px;padding:9px 13px;border:1.5px solid var(--card-border-solid);border-radius:12px;background:var(--neu-bg);font-size:13px}
  .pp-mr-row strong{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
  .pp-mr-row span{text-align:left;max-width:100%}
}

/* Bottom sheet modal system (mobile only) — confirmations opt out via .no-sheet */
@keyframes slideUp{from{transform:translateY(100%);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-handle{display:none;width:44px;height:5px;border-radius:10px;background:var(--card-border-solid);margin:-8px auto 12px}
.sheet-head-sticky{position:sticky;top:calc(-20px - env(safe-area-inset-top,0px));background:var(--panel-bg);z-index:26;margin:-20px -18px 12px;padding:14px 18px 10px}
@media(max-width:768px){
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal-card:not(.no-sheet),
  .modal-card.wide:not(.no-sheet),
  .modal-card.sheet:not(.no-sheet){position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;border-radius:24px 24px 0 0;max-height:85vh;max-height:85dvh;overflow-y:auto;overflow-x:hidden;animation:slideUp 320ms cubic-bezier(0.22,1,0.36,1);padding:20px 18px calc(16px + env(safe-area-inset-bottom,0px));border-bottom:none}
  .modal-card:not(.no-sheet) .sheet-handle{display:block}
  .modal-card:not(.no-sheet) .modal-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--panel-bg);margin-top:14px;padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:26;border-top:1px solid var(--card-border-solid)}
  .modal-card:not(.no-sheet) .modal-actions .btn-primary{flex:1;justify-content:center}
  /* Confirmation dialogs must stay small centered popups on mobile too. */
  .modal-card.no-sheet{position:fixed;left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(100% - 32px);max-width:440px;border-radius:var(--radius-card);max-height:90vh;max-height:90dvh;animation:popInCentered 280ms cubic-bezier(0.34,1.5,0.64,1);padding:24px}
  .modal-card.no-sheet .sheet-handle{display:none}
}
@media(min-width:769px){
  .sheet-head-sticky{position:static;background:none;margin:0;padding:0}
}

/* Button loading — mute button, three dots pulse in a traveling wave */
.btn.loading{
  background: var(--text-muted) !important;
  border-color: var(--text-muted) !important;
  color: var(--panel-bg) !important;
  opacity: .6;

/* =============== HELPERS =============== */
function escHtml(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function emptyIcon(){ return '<i class="ph ph-minus" style="color:var(--text-muted);opacity:.4"></i>' }
/* Store full text values off-DOM so we can show them in a modal via a small eye-icon button in table cells */
const TEXT_PREVIEW_STORE = {}
let __textPreviewSeq = 0
function eyeIconCell(text, title='Details'){
  if (!text) return emptyIcon()
  const key = 'tp' + (__textPreviewSeq++)
  TEXT_PREVIEW_STORE[key] = { text: String(text), title }
  return `<button type="button" class="icon-btn eye-btn" data-text-preview="${key}" aria-label="View ${escHtml(title)}"><i class="ph-bold ph-eye"></i></button>`
}
function wireEyeIconCells(container){
  container.querySelectorAll('[data-text-preview]').forEach(btn => {
    btn.addEventListener('click', () => {
      const entry = TEXT_PREVIEW_STORE[btn.dataset.textPreview]
      if (!entry) return
      showInfoModal(entry.title, `<div style="white-space:pre-wrap;line-height:1.6">${escHtml(entry.text)}</div>`)
    })
  })
}
function formatDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) }
function formatDateTime(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) }
function formatCurrency(n){ const v = Number(n||0); return '₦' + v.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function badge(status){ if(!status) return emptyIcon(); const s = String(status).toLowerCase(); return `<span class="badge ${escHtml(s)}">${escHtml(s.replace(/_/g,' '))}</span>` }
// 4-state prescription fulfillment badge: unpaid, pending_verification, paid (not dispensed), dispensed
function rxStatusBadge(state){
  const labels = { unpaid:'Unpaid', pending_verification:'Pending Verification', paid:'Paid — Not Dispensed', dispensed:'Dispensed' }
  return `<span class="badge ${escHtml(state.key)}">${escHtml(labels[state.key] || state.key)}</span>`
}
function docName(name){ return `<span style="display:inline-flex;align-items:center;gap:6px"><i class="ph ph-stethoscope" style="color:var(--primary);font-size:15px;opacity:.85"></i><span style="font-weight:600">Dr. ${escHtml(name||'Unknown')}</span></span>` }
function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase() }
function computeAge(dob){
  if (!dob) return null
  const d = new Date(dob); if (isNaN(d)) return null
  const now = new Date()
  let age = now.getFullYear() - d.getFullYear()
  const m = now.getMonth() - d.getMonth()
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--
  return age >= 0 ? age : null
}
function isNetworkError(err){
  if (!err) return false
  const m = (err.message || String(err)).toLowerCase()
  return m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed') || !navigator.onLine
}
function handleErr(err, fallback='Something went wrong'){
  if (isNetworkError(err)){ showToast('error','Check your internet connection'); return }
  showToast('error', err?.message || fallback)
}

function buildTable(columns, rows, opts={}){
  if (!rows || rows.length === 0) return `<div class="state-box"><i class="ph ph-tray"></i>${opts.emptyText||'No records yet.'}</div>`
  const thead = '<thead><tr>' + columns.map(c => `<th>${escHtml(c.label)}</th>`).join('') + '</tr></thead>'
  const tbody = '<tbody>' + rows.map(r => '<tr>' + columns.map(c => {
    let v = c.render ? c.render(r) : (c.badge ? badge(r[c.key]) : escHtml(r[c.key]))
    return `<td${c.cellClass?' class="'+c.cellClass+'"':''}>${v}</td>`
  }).join('') + '</tr>').join('') + '</tbody>'
  return `<table>${thead}${tbody}</table>`
}

/* ============ SHARED ACCORDION CARDS (same visual language as doctor dashboard) ============
   Collapsed summary (avatar/icon, code, name, badge, key details) expands on tap.
   Only one card is open at a time — siblings are closed explicitly in JS, never by CSS. */
function acCardHtml(i, o){
  const head = o.avatar
    ? `<div class="ac-avatar">${o.avatar}</div>`
    : `<div class="rx-hist-ic"><i class="ph ${o.icon || 'ph-file-text'}"></i></div>`
  return `<div class="rx-hist-card appt-ac" data-ac-idx="${i}">
    <button type="button" class="rx-hist-head" data-ac-toggle="${i}">
      ${head}
      <div class="rx-hist-meta">
        <div class="rx-hist-code"><span class="ac-idline">${o.code ? `<span class="ac-code">${o.code}</span>` : ''}${o.name ? `<span class="ac-name">${o.name}</span>` : ''}</span>${o.badge || ''}</div>
        <div class="rx-hist-sub">${o.sub || ''}</div>
      </div>
      <i class="ph ph-caret-down rx-hist-chev"></i>
    </button>
    <div class="rx-hist-body"><div class="ac-body-inner">${o.body || ''}</div></div>
  </div>`
}
function renderAccordion(el, items, emptyText){
  if (!el) return
  if (!items || !items.length){
    el.innerHTML = `<div class="state-box"><i class="ph ph-tray"></i>${escHtml(emptyText || 'No records yet.')}</div>`
    return
  }
  el.innerHTML = `<div class="appt-ac-list">${items.map((o,i) => acCardHtml(i,o)).join('')}</div>`
  el.querySelectorAll('[data-ac-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.rx-hist-card')
      if (!card) return
      const wasOpen = card.classList.contains('open')
      el.querySelectorAll('.rx-hist-card.open').forEach(c => { if (c !== card) c.classList.remove('open') })
      card.classList.toggle('open', !wasOpen)
    })
  })
}
function acField(label, valueHtml, extraClass){
  return `<div${extraClass ? ` class="${extraClass}"` : ''}><div class="ac-k">${escHtml(label)}</div><div class="ac-v">${valueHtml}</div></div>`
}
function shiftBadge(shift){ return shift ? `<span class="badge ${shift==='day'?'approved':'completed'}">${escHtml(shift)}</span>` : '' }
function formatTime(t){ if(!t) return '—'; const s=String(t); const m=s.match(/^(\d{1,2}):(\d{2})/); if(!m) return escHtml(s); let h=parseInt(m[1],10); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${m[2]} ${ap}` }

/* ============ Button loading helper (traveling wave of 3 pulsing dots) ============
   Buttons must follow: <button class="btn-* btn"><i class="btn-icon …"></i><span class="btn-text">…</span><span class="btn-dots"><span></span><span></span><span></span></span></button> */
function setBtnLoading(btn, on){
  if (!btn) return
  if (on){
    if (btn.dataset.loadingOrig === undefined) btn.dataset.loadingOrig = btn.innerHTML
    btn.disabled = true
    btn.classList.add('loading')
  } else {
    btn.disabled = false
    btn.classList.remove('loading')
    delete btn.dataset.loadingOrig
  }
}

/* Skeleton for accordion card lists */
function skCards(n=4){
  let h=''
  for(let i=0;i<n;i++) h+=`<div class="ac-sk"><div class="sk sk-circle"></div><div class="sk-meta"><span class="sk sk-line" style="width:45%"></span><span class="sk sk-line" style="width:65%"></span></div></div>`
  return h
}

function buildPagination(pagEl, infoEl, currentPage, pageSize, totalCount, loadFn){
  const totalPages = Math.max(1, Math.ceil(totalCount / pageSize))
  const from = totalCount === 0 ? 0 : (currentPage-1)*pageSize + 1
  const to = Math.min(currentPage*pageSize, totalCount)
  infoEl.textContent = totalCount === 0 ? 'No results' : `Showing ${from}–${to} of ${totalCount}`
  let html = `<button class="page-pill" ${currentPage===1?'disabled':''} data-p="${currentPage-1}" aria-label="Previous page"><i class="ph ph-caret-left"></i></button>`
  const maxShow = 5; let start = Math.max(1, currentPage - 2); let end = Math.min(totalPages, start + maxShow - 1); start = Math.max(1, end - maxShow + 1)
  for (let i = start; i <= end; i++) html += `<button class="page-pill ${i===currentPage?'active':''}" data-p="${i}">${i}</button>`
  html += `<button class="page-pill" ${currentPage===totalPages?'disabled':''} data-p="${currentPage+1}" aria-label="Next page"><i class="ph ph-caret-right"></i></button>`
  pagEl.innerHTML = html
  pagEl.querySelectorAll('.page-pill[data-p]').forEach(btn => btn.addEventListener('click', () => {
    const p = parseInt(btn.dataset.p,10); if (!isNaN(p) && p >= 1 && p <= totalPages) loadFn(p)
  }))
}

/* =============== TOAST =============== */
function showToast(type, message){
  const duration = type === 'error' ? 6000 : 4000
  const wrap = document.getElementById('toastContainer')
  const t = document.createElement('div')
  t.className = `toast t-${type}`
  const icons = { success:'ph-check', error:'ph-x', info:'ph-info', warning:'ph-warning' }
  const ic = icons[type] || icons.info
  t.innerHTML = `<div class="toast-icon"><i class="ph-bold ${ic}"></i></div><div class="toast-text">${escHtml(message)}</div><button class="toast-close" aria-label="Close"><i class="ph ph-x"></i></button>`
  wrap.appendChild(t)
  requestAnimationFrame(() => t.classList.add('show'))

  const dismiss = () => { t.classList.add('hide'); setTimeout(() => t.remove(), 300) }
  t.querySelector('.toast-close').addEventListener('click', dismiss)
  let autoTimer = setTimeout(dismiss, duration)

  // Drag/swipe-to-dismiss (mouse + touch): drag the toast up, left, or right past a distance
  // threshold to close it early; downward drag doesn't count since the toast lives at the top.
  const DISMISS_THRESHOLD = 80
  let startX = 0, startY = 0, curX = 0, curY = 0, dragging = false

  function onDragStart(x, y){
    startX = x; startY = y; curX = 0; curY = 0
    dragging = true
    clearTimeout(autoTimer)
    t.classList.add('is-dragging')
    t.style.transition = 'none'
  }
  function onDragMove(x, y){
    if (!dragging) return
    curX = x - startX; curY = y - startY
    const effY = Math.min(curY, 0)
    const dist = Math.hypot(curX, effY)
    const opacity = Math.max(0, 1 - dist / (DISMISS_THRESHOLD * 1.5))
    t.style.transform = `translate(${curX}px, ${curY}px)`
    t.style.opacity = opacity
  }
  function onDragEnd(){
    if (!dragging) return
    dragging = false
    const effY = Math.min(curY, 0)
    const dist = Math.hypot(curX, effY)
    if (dist >= DISMISS_THRESHOLD){
      const scale = 2.5
      t.style.transition = 'transform 250ms ease, opacity 200ms ease'
      t.style.transform = `translate(${curX*scale}px, ${curY*scale}px)`
      t.style.opacity = '0'
      setTimeout(() => t.remove(), 260)
    } else {
      t.style.transition = 'transform 320ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease'
      t.style.transform = 'translate(0,0)'
      t.style.opacity = '1'
      t.classList.remove('is-dragging')
      autoTimer = setTimeout(dismiss, 3000)
    }
  }
  t.addEventListener('mousedown', e => {
    if (e.target.closest('.toast-close')) return
    onDragStart(e.clientX, e.clientY)
    const onMove = ev => onDragMove(ev.clientX, ev.clientY)
    const onUp = () => { onDragEnd(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp) }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
  t.addEventListener('touchstart', e => {
    if (e.target.closest('.toast-close')) return
    const touch = e.touches[0]
    onDragStart(touch.clientX, touch.clientY)
  }, {passive:true})
  t.addEventListener('touchmove', e => {
    const touch = e.touches[0]
    onDragMove(touch.clientX, touch.clientY)
    e.preventDefault()
  }, {passive:false})
  t.addEventListener('touchend', onDragEnd)
  t.addEventListener('touchcancel', onDragEnd)
}

/* =============== CONFIRM =============== */
function showConfirm(title, message, confirmLabel='Confirm', extraClass=''){
  return new Promise(resolve => {
    const bd = document.createElement('div')
    bd.className = 'modal-backdrop'
    bd.innerHTML = `<div class="modal-card${extraClass ? ' ' + extraClass : ''}"><div class="modal-title">${escHtml(title)}</div><div class="modal-msg">${escHtml(message)}</div><div class="modal-actions"><button class="btn-secondary" data-act="cancel">Cancel</button><button class="btn-danger" data-act="ok" style="padding:10px 20px;font-size:13px">${escHtml(confirmLabel)}</button></div></div>`
    document.body.appendChild(bd)
    const close = v => { bd.remove(); resolve(v) }
    bd.addEventListener('click', e => { if (e.target === bd) close(false) })
    bd.querySelector('[data-act="cancel"]').addEventListener('click', () => close(false))
    bd.querySelector('[data-act="ok"]').addEventListener('click', () => close(true))
  })
}
function showInfoModal(title, htmlBody){
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `<div class="modal-card sheet"><div class="sheet-head-sticky"><div class="sheet-handle"></div><div class="modal-title" style="margin-bottom:0">${escHtml(title)}</div></div><div class="modal-msg">${htmlBody}</div><div class="modal-actions"><button class="btn-primary" data-act="close">Close</button></div></div>`
  document.body.appendChild(bd)

  bd.querySelector('[data-act="close"]').addEventListener('click', close)
}

/* =============== CUSTOM SELECT =============== */
const CS_STATE = {}
document.addEventListener('click', e => { if (!e.target.closest('.custom-select-wrap')) document.querySelectorAll('.custom-select-wrap.open').forEach(w => w.classList.remove('open')) })
function _csRender(id){
  const wrap = document.getElementById(id); const st = CS_STATE[id]; if (!wrap || !st) return
  const isFilter = wrap.classList.contains('cs-filter')
  const caretIcon = isFilter ? 'ph-funnel-simple' : 'ph-caret-circle-down'
  const sel = st.options.find(o => String(o.value) === String(st.value))
  const labelText = sel ? sel.label : (st.placeholder || 'Select…'); const cls = sel ? '' : ' placeholder'
  const opts = st.options.length ? st.options.map((o,idx) => `<div class="cs-option${String(o.value)===String(st.value)?' active':''}${o.disabled?' disabled':''}" data-v="${escHtml(o.value)}" data-idx="${idx}" role="option">${escHtml(o.label)}${String(o.value)===String(st.value)?'<i class="ph ph-check"></i>':''}</div>`).join('') : '<div class="cs-option disabled">No options</div>'
  wrap.innerHTML = `<button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false" tabindex="0"><span class="cs-label${cls}">${escHtml(labelText)}</span><i class="ph ${caretIcon} cs-caret"></i></button><div class="custom-select-options" role="listbox">${opts}</div>`
  const trig = wrap.querySelector('.custom-select-trigger')
  const openIt = () => {
    if (wrap.classList.contains('is-muted')){ showToast('info','Contact admin to change this.'); return }
    document.querySelectorAll('.custom-select-wrap.open').forEach(w => { if (w.id !== id) w.classList.remove('open') })
    wrap.classList.add('open'); trig.setAttribute('aria-expanded','true')
    const cur = wrap.querySelector('.cs-option.active') || wrap.querySelector('.cs-option:not(.disabled)')
    if (cur) cur.classList.add('focused')
    // Dynamically cap dropdown height to whatever space is actually available (viewport, and the
    // enclosing modal-card's own scroll area if inside a modal), so on small mobile screens the
    // option list never overflows off-screen or behind the browser chrome — it scrolls internally instead.
    requestAnimationFrame(() => {
      const optionsEl = wrap.querySelector('.custom-select-options')
      if (!optionsEl) return
      const triggerRect = trig.getBoundingClientRect()
      const modalCard = wrap.closest('.modal-card')
      const boundaryBottom = modalCard ? modalCard.getBoundingClientRect().bottom : window.innerHeight
      const margin = 16
      const available = Math.max(120, Math.min(280, boundaryBottom - triggerRect.bottom - margin))
      optionsEl.style.maxHeight = available + 'px'
      // If inside a modal, make sure the open dropdown is scrolled into view within the modal's own scroll container.
      if (modalCard){
        const optRect = optionsEl.getBoundingClientRect()
        const cardRect = modalCard.getBoundingClientRect()
        if (optRect.bottom > cardRect.bottom) modalCard.scrollTop += (optRect.bottom - cardRect.bottom) + margin
      }
    })
  }
  const closeIt = () => { wrap.classList.remove('open'); trig.setAttribute('aria-expanded','false'); wrap.querySelectorAll('.cs-option.focused').forEach(o=>o.classList.remove('focused')) }
  trig.addEventListener('click', e => { e.stopPropagation(); wrap.classList.contains('open') ? closeIt() : openIt() })
  trig.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){ e.preventDefault(); openIt() }
    if (e.key === 'Escape') closeIt()
  })
  wrap.querySelectorAll('.cs-option').forEach(opt => {
    if (opt.classList.contains('disabled')) return
    opt.addEventListener('click', e => { e.stopPropagation(); const v = opt.dataset.v; setCS(id, v); closeIt(); if (st.onChange) st.onChange(v); wrap.classList.remove('is-invalid') })
    opt.addEventListener('mouseenter', () => { wrap.querySelectorAll('.cs-option.focused').forEach(o=>o.classList.remove('focused')); opt.classList.add('focused') })
  })
  wrap.addEventListener('keydown', e => {
    if (!wrap.classList.contains('open')) return
    const options = [...wrap.querySelectorAll('.cs-option:not(.disabled)')]
    let cur = options.findIndex(o => o.classList.contains('focused'))
    if (e.key === 'ArrowDown'){ e.preventDefault(); cur = (cur+1) % options.length; options.forEach(o=>o.classList.remove('focused')); options[cur].classList.add('focused'); options[cur].scrollIntoView({block:'nearest'}) }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); cur = (cur-1+options.length) % options.length; options.forEach(o=>o.classList.remove('focused')); options[cur].classList.add('focused'); options[cur].scrollIntoView({block:'nearest'}) }
    else if (e.key === 'Enter'){ e.preventDefault(); if (options[cur]) options[cur].click() }
    else if (e.key === 'Escape'){ e.preventDefault(); closeIt(); trig.focus() }
  })
}
function initCS(id, options, opts={}){ const wrap = document.getElementById(id); if (!wrap) return; CS_STATE[id] = { options: options || [], value: opts.value !== undefined ? opts.value : (wrap.dataset.csDefault || ''), placeholder: opts.placeholder || wrap.dataset.csPlaceholder || 'Select…', onChange: opts.onChange || null }; _csRender(id) }
function popCS(id, options){ if (!CS_STATE[id]) initCS(id, options); else { CS_STATE[id].options = options || []; if (!options.find(o => String(o.value) === String(CS_STATE[id].value))) CS_STATE[id].value = ''; _csRender(id) } }
function getCS(id){ return CS_STATE[id]?.value || '' }
function setCS(id, v){ if (!CS_STATE[id]) return; CS_STATE[id].value = v == null ? '' : String(v); _csRender(id) }
