<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ATBU MediCare</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
  <script>(function(){try{var t=localStorage.getItem('atbu-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
  :root{
    --primary:#1E7FB8; --primary-mid:#2C97D6; --primary-light:#5CB8E4;
    --bg:#F0F9FD; --panel-bg:#FFFFFF;
    --text:#0F172A; --text-muted:#64748B;
    --input-bg:#FFFFFF; --input-border:#CBD5E1;
    --card-border:rgba(255,255,255,0.80);
    --success:#1E8449; --error:#EF4444; --white:#FFFFFF;
    --shadow-rgb:30,127,184;
    --radius-card:20px; --radius-input:12px; --radius-btn:10px;
    --brand-grad:linear-gradient(135deg,#2C97D6 0%,#1E7FB8 100%);
  }
  [data-theme="dark"]{
    --primary:#5CB8E4; --primary-mid:#2C97D6; --primary-light:#8ECFEE;
    --bg:#0E1A22; --panel-bg:#142833;
    --text:#EAF6FB; --text-muted:#8FB3C3;
    --input-bg:#102530; --input-border:#28455A;
    --card-border:rgba(92,184,228,0.22);
    --error:#F87171; --white:#EAF6FB;
    --shadow-rgb:92,184,228;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Poppins",sans-serif;
    background:var(--bg); color:var(--text);
    font-size:15px;min-height:100vh;
    display:grid;place-items:center;padding:20px;
    transition:background 380ms ease,color 380ms ease;
  }
  .bg-blob{position:fixed;z-index:0;pointer-events:none;}
  .bg-blob.b1{width:500px;height:500px;background:rgba(16,185,129,0.12);border-radius:50%;filter:blur(90px);top:-150px;left:-150px;}
  .bg-blob.b2{width:420px;height:420px;background:rgba(var(--shadow-rgb),0.10);border-radius:50%;filter:blur(80px);bottom:-120px;right:-120px;}

  .card{
    position:relative;z-index:1;
    width:100%;max-width:420px;
    background:color-mix(in srgb,var(--panel-bg) 92%,transparent);
    border:1px solid var(--card-border);
    border-radius:var(--radius-card);
    padding:32px 28px;
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 20px 50px rgba(var(--shadow-rgb),0.18);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-icon{
    width:48px;height:48px;
    display:grid;place-items:center;
    overflow:hidden;
  }
  .brand-icon img{width:100%;height:100%;object-fit:contain;display:block}
  .brand-icon i{color:#fff;font-size:21px;}
  .brand-name{font-size:14px;font-weight:800;color:var(--text);line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:2px;}

  h1{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;}
  .lead{font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.5;}

  label{display:block;font-size:12px;font-weight:600;color:var(--text);margin:14px 0 6px;}
  input[type="password"]{
    width:100%;padding:12px 14px;
    background:var(--input-bg);color:var(--text);
    border:1px solid var(--input-border);
    border-radius:var(--radius-input);
    font:500 14px "Poppins",sans-serif;
    transition:border 180ms ease, box-shadow 180ms ease;
  }
  input[type="password"]:focus{outline:none;border-color:var(--primary-mid);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15);}

  .btn-primary{
    width:100%;margin-top:20px;
    padding:13px 18px;border:none;cursor:pointer;
    background:var(--brand-grad);color:#fff;
    border-radius:var(--radius-btn);
    font:700 13.5px "Poppins",sans-serif;letter-spacing:0.02em;
    box-shadow:0 8px 20px rgba(var(--shadow-rgb),0.30);
    transition:transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
  }
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px rgba(var(--shadow-rgb),0.38);}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

  .msg{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;display:none;}
  .msg.show{display:block;}
  .msg.error{background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.25);}
  .msg.success{background:rgba(16,185,129,0.12);color:var(--primary-mid);border:1px solid rgba(16,185,129,0.30);}
  .msg.info{background:rgba(100,116,139,0.12);color:var(--text-muted);border:1px solid rgba(100,116,139,0.25);}

  /* ===================== TOP ISLAND (matches admin/doctor dashboards) ===================== */
  .topbar-shell{position:fixed;top:0;left:0;right:0;z-index:90;max-width:1200px;margin:12px auto 0;padding-inline:clamp(20px,6vw,120px);pointer-events:none}
  .topbar{position:relative;width:100%;padding:10px 20px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--input-border);border-radius:var(--radius-card);box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.12);display:flex;align-items:center;gap:14px;pointer-events:auto}
  .topbar-brand{display:flex;align-items:center;gap:10px}
  .topbar-brand-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;overflow:hidden;flex-shrink:0}
  .topbar-brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
  .topbar-brand-name{font-weight:800;font-size:15px;color:var(--text);line-height:1.1;letter-spacing:.01em}
  body{padding-top:96px;}
  @media (max-width:500px){ body{padding-top:88px;} }
  </style>
</head>
<body>
<div class="topbar-shell">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-brand-icon"><img src="logo.png" alt="ATBU MediCare Logo"/></div>
      <div class="topbar-brand-name">ATBU MediCare</div>
    </div>
  </div>
</div>

<div class="bg-blob b1" aria-hidden="true"></div>
<div class="bg-blob b2" aria-hidden="true"></div>

<div class="card">

  <h1>Set New Password</h1>
  <p class="lead">Choose a strong new password for your account. Must be at least 8 characters.</p>

  <div id="msgStatus" class="msg info show">Verifying recovery link…</div>

  <form id="resetForm" style="display:none;">
    <label for="newPwd">New Password</label>
    <input type="password" id="newPwd" minlength="8" required autocomplete="new-password" />

    <label for="confirmPwd">Confirm Password</label>
    <input type="password" id="confirmPwd" minlength="8" required autocomplete="new-password" />

    <button class="btn-primary" type="submit" id="submitBtn">Update Password</button>
    <div id="msgError" class="msg error"></div>
    <div id="msgSuccess" class="msg success"></div>
  </form>
</div>

<script>
(function(){
  'use strict';
  const SUPABASE_URL      = 'https://qseuseqkzvnlqsartkoq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzZXVzZXFrenZubHFzYXJ0a29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjcwMTcsImV4cCI6MjA5OTIwMzAxN30.49UXm0BhbHy6oEAYRTJjddiRB3VsrVg-jkgmAa2fEH4';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl  = document.getElementById('msgStatus');
  const form      = document.getElementById('resetForm');
  const errorEl   = document.getElementById('msgError');
  const successEl = document.getElementById('msgSuccess');
  const submitBtn = document.getElementById('submitBtn');

  let recoveryReady = false;

  function showStatus(text, kind){
    statusEl.className = 'msg ' + (kind || 'info') + ' show';
    statusEl.textContent = text;
  }
  function hideStatus(){ statusEl.classList.remove('show'); }
  function showError(text){
    errorEl.textContent = text;
    errorEl.classList.add('show');
    successEl.classList.remove('show');
  }
  function showSuccess(text){
    successEl.textContent = text;
    successEl.classList.add('show');
    errorEl.classList.remove('show');
  }

  function enableForm(){
    recoveryReady = true;
    hideStatus();
    form.style.display = 'block';
  }

  // Listen for PASSWORD_RECOVERY / SIGNED_IN from the URL hash
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      enableForm();
    }
  });

  // Try code exchange (PKCE-style ?code=...) first
  (async function init(){
    try {
      const url = new URL(window.location.href);
      if (url.searchParams.get('code')) {
        const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
        if (!error) { enableForm(); return; }
      }
      // Fallback: hash-based tokens — getSession will pick them up
      const { data } = await sb.auth.getSession();
      if (data && data.session) { enableForm(); return; }
      // Wait briefly for onAuthStateChange to fire
      setTimeout(() => {
        if (!recoveryReady) {
          showStatus('This reset link is invalid or has expired. Please request a new one.', 'error');
        }
      }, 1500);
    } catch (err) {
      showStatus('Could not verify reset link: ' + (err.message || 'unknown error'), 'error');
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    successEl.classList.remove('show');

    const pwd  = document.getElementById('newPwd').value;
    const conf = document.getElementById('confirmPwd').value;

    if (pwd.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (pwd !== conf)   { showError('Passwords do not match.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    const { error } = await sb.auth.updateUser({ password: pwd });
    if (error) {
      showError(error.message || 'Failed to update password.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
      return;
    }

    // Manually link the 'email' identity — Supabase does NOT automatically add
    // this for OAuth-only (Google) accounts after updateUser({ password }), even
    // though the password itself is saved and works. Without this, the app can
    // never detect that the user now has password auth. See link_email_identity()
    // in the schema. Non-fatal if it fails — password change itself already
    // succeeded, so we don't block the user on this.
    const { error: linkErr } = await sb.rpc('link_email_identity');
    if (linkErr) console.warn('link_email_identity failed:', linkErr.message);

    // Sign out immediately so this recovery session/link can't be reused to
    // change the password again later (recovery tokens can otherwise remain
    // valid in the browser and be replayed against updateUser a second time).
    await sb.auth.signOut();

    showSuccess('Password updated. Redirecting…');
    submitBtn.textContent = 'Done';
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  });
})();
</script>
</body>
</html>
